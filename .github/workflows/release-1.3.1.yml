name: Publish CQuests 1.3.1

on:
  push:
    branches: [claude/project-thread-eax6qq]
    paths: [.github/workflows/release-1.3.1.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cquests-1.3.1
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 0776f718ba4c866c07245f8a687308dba448db13
      CHECKED_RUN: '41425925835'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 0776f718ba4c866c07245f8a687308dba448db13
      - name: Verify checked commit and collect its tested JAR
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN --jq '.conclusion')" = success
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN/jobs --jq '[.jobs[] | select(.conclusion != "success")] | length')" = 0
          if gh release view v1.3.1 >/dev/null 2>&1; then
            echo 'Release v1.3.1 already exists; refusing to replace it.' >&2
            exit 1
          fi
          gh run download "$CHECKED_RUN" --name CQuests --dir tested
          test -f tested/CQuests-1.3.1.jar
      - name: Package source, setup guide and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/bundle
          cp tested/CQuests-1.3.1.jar out/
          git archive --format=zip --prefix=CQuests/ --output=out/CQuests-1.3.1-source.zip HEAD
          cp out/CQuests-1.3.1.jar out/CQuests-1.3.1-source.zip MERCHANTS-1.3.md AUDIT-1.3.1.md out/bundle/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          out=Path('out');bundle=out/'bundle'
          def digest(p,kind='sha256'):return hashlib.new(kind,p.read_bytes()).hexdigest()
          manifest={'version':'1.3.1','commit':os.environ['SOURCE_SHA'],'tested_jar_from_run':int(os.environ['CHECKED_RUN']),'github_actions':'https://github.com/'+os.environ['GH_REPO']+'/actions/runs/'+os.environ['CHECKED_RUN'],'unit_tests':68,'note':'JAR is downloaded unchanged from the successful build and server smoke-test run. Local protocol-client validation is described in AUDIT-1.3.1.md; its local JAR checksum may differ from the CI-built artifact.','files':{p.name:{'bytes':p.stat().st_size,'sha256':digest(p),'sha1':digest(p,'sha1')} for p in sorted(bundle.iterdir())}}
          (bundle/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with zipfile.ZipFile(out/'CQuests-1.3.1-release.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(bundle.iterdir()):z.write(p,'CQuests-1.3.1/'+p.name)
          files=sorted(p for p in out.iterdir() if p.is_file())
          (out/'CQuests-1.3.1-CHECKSUMS.txt').write_text(''.join(f'SHA256 {digest(p)}  {p.name}\nSHA1   {digest(p,"sha1")}  {p.name}\n' for p in files))
          PY
          cat > out/notes.md <<'NOTES'
          Adds easier travelling-merchant setup, player-skin quest NPCs, story twists and interaction hardening.

          - Set `/cq merchant spawn <id>`, get `/cq merchant wand <id>`, right-click ground blocks along the trail, then run `/cq merchant end <id>` while facing the store direction. Merchants walk through the waypoints and face the saved direction on arrival.
          - Five editable merchants support item-only, money-only and combined prices. Crouch-click editing is OP-only.
          - `/cq npc skin <id> <username|default|villager>` changes quest NPC appearance. Player-shaped NPCs require Minecraft 1.21.9+; older versions fall back to villagers.
          - Overhead dialogue types progressively, sentence by sentence, and remains private to the player speaking. Paper/Folia protocol tests observed the progressive text updates and confirmed another player did not receive them.
          - GUI callback queues are bounded. Replayed trade packets and repeated quest claim commands were checked for duplicate rewards.

          Validation: 68 unit tests passed; Paper 1.21.4, Paper latest and Folia latest CI smoke tests passed. Separate Paper/Folia 26.2 client and restart tests covered dialogue, custom XP, merchant routes/facing, editing restrictions, trades, persistence and route-ticket cleanup. The attached JAR is the unchanged artifact from the successful CI run:
          https://github.com/tobyal2bs-wq/CQuests/actions/runs/41425925835

          Install: stop the server, back up CQuests data, replace the old JAR and keep the existing data folder. Quest progress is preserved. Stage-test the actual custom Vault economy; protocol checks do not replace visual client testing or guarantee every third-party plugin combination.

          Download the JAR for installation, or the release ZIP for the JAR, source, setup guide, audit notes and manifest. SHA256 and SHA1 checksums are attached.
          NOTES
      - name: Create, verify and publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.3.1 out/CQuests-1.3.1.jar out/CQuests-1.3.1-source.zip out/CQuests-1.3.1-release.zip out/CQuests-1.3.1-CHECKSUMS.txt --target "$SOURCE_SHA" --title 'CQuests 1.3.1 - Travelling merchants and NPC skins' --notes-file out/notes.md --draft
          test "$(gh release view v1.3.1 --json assets --jq '.assets | length')" = 4
          gh release edit v1.3.1 --draft=false --latest
          gh release view v1.3.1 --json url,isDraft,tagName,assets >> "$GITHUB_STEP_SUMMARY"
