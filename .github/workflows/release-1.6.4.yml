name: Publish CQuests 1.6.4

on:
  push:
    branches: [claude/project-thread-eax6qq]
    paths: [.github/workflows/release-1.6.4.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cquests-1.6.4
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 16170117d6ef579e07c2f26402dba34075f930d8
      CHECKED_RUN: '41608262604'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 16170117d6ef579e07c2f26402dba34075f930d8
      - name: Verify checked commit and collect its tested JAR
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN --jq '.conclusion')" = success
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN/jobs --jq '[.jobs[] | select(.conclusion != "success")] | length')" = 0
          if gh release view v1.6.4 >/dev/null 2>&1; then
            echo 'Release v1.6.4 already exists; refusing to replace it.' >&2
            exit 1
          fi
          gh run download "$CHECKED_RUN" --name CQuests --dir tested
          test -f tested/CQuests-1.6.4.jar
          grep -Fq 'version = "1.6.4"' build.gradle.kts
      - name: Package source, setup guide and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/bundle
          cp tested/CQuests-1.6.4.jar out/
          git archive --format=zip --prefix=CQuests/ --output=out/CQuests-1.6.4-source.zip HEAD
          cp out/CQuests-1.6.4.jar out/CQuests-1.6.4-source.zip QUEST-HOME-1.6.4.md OPTIMISATION-1.6.3.md MAIL-DIALOGUE-1.6.2.md DIALOGUE-FIX-1.6.1.md MERCHANTS-AND-AI-MAIL-1.6.0.md MAIL-AND-DISCOVERIES-1.5.0.md WORKSHOP-1.3.4.md ADVENTURES-1.4.0.md FARM-TESTING.md out/bundle/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          out=Path('out');bundle=out/'bundle'
          def digest(p,kind='sha256'):return hashlib.new(kind,p.read_bytes()).hexdigest()
          manifest={'version':'1.6.4','commit':os.environ['SOURCE_SHA'],'tested_jar_from_run':int(os.environ['CHECKED_RUN']),'github_actions':'https://github.com/'+os.environ['GH_REPO']+'/actions/runs/'+os.environ['CHECKED_RUN'],'unit_tests':124,'note':'JAR is downloaded unchanged from the successful build and server smoke-test run. Paper/Folia 26.2 quest home, navigation, directions, upgrade return paths and mail regression checks passed on local JAR SHA256 2f6db60b7057498369850e3047c66ac9af4c8e4219ce3ff68453c53218dbc270. This CI-built artifact can differ in ZIP timestamps.','files':{p.name:{'bytes':p.stat().st_size,'sha256':digest(p),'sha1':digest(p,'sha1')} for p in sorted(bundle.iterdir())}}
          (bundle/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with zipfile.ZipFile(out/'CQuests-1.6.4-release.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(bundle.iterdir()):z.write(p,'CQuests-1.6.4/'+p.name)
          files=sorted(p for p in out.iterdir() if p.is_file())
          (out/'CQuests-1.6.4-CHECKSUMS.txt').write_text(''.join(f'SHA256 {digest(p)}  {p.name}\nSHA1   {digest(p,"sha1")}  {p.name}\n' for p in files))
          PY
          cat > out/notes.md <<'NOTES'
          A simpler starting point for players who get lost in the quest book.

          - `/quests` opens Quest home with the current level, next story quest and clear buttons: What should I do?, My quests, Mail, Farming & tools, Settings and Close.
          - What should I do? shows the next task in plain language, or explains the level/previous-task requirement. My quests lists active work with readable progress and page buttons.
          - Quest details always have Back to my quests and Back to quest home. The mail inbox and hoe-upgrade inventory also have a way back home.
          - `/quests settings` contains only the tracker and directions switches, and stays on the same screen after a change. Show directions selects an active quest and enables its arrow without toggling it off on repeat clicks.
          - Reading the journal never accepts or completes a quest, claims rewards, or bypasses NPC and progression requirements. Future quest IDs cannot be used to open arbitrary story details.
          - Native dialogues are used on supported Java clients; older clients get a locked menu with the same navigation. Books are optional through `/quests book`. Explicit menu/chat commands remain. Saved book/menu/chat preferences are preserved for fallback NPC conversations, while `/quests` always leads home.
          - Existing mail dialogues, animation fixes and 1.6.3 optimisations are included. No player progress reset.

          Validation: 124 unit tests, including default routing with saved book preference, clear next steps, future-quest rejection, level explanations, settings/back paths, idempotent directions and journal permissions. Local Paper/Folia 26.2 protocol tests cover the complete home flow, quest details, settings, mail, farming help, actual return clicks from upgrade and legacy menus, future-ID attempts and preserved progress. Normal navigation opens no book; the explicit book command remains functional. The mail dialogue regression also passed. The linked CI run passed build, Paper 1.21.4, Paper latest and Folia latest checks. No graphical-client or hosted-server review is claimed.
          https://github.com/tobyal2bs-wq/CQuests/actions/runs/41608262604

          Stop the server, back up CQuests data, replace the JAR and keep the data folder. See QUEST-HOME-1.6.4.md. No reset or configuration migration is required.

          The public JAR is downloaded unchanged from the successful CI run. Source, guides and SHA256/SHA1 checksums are included. Local protocol checks used the same source; the manifest records the local JAR hash because ZIP timestamps can differ.
          NOTES
      - name: Create, verify and publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.6.4 out/CQuests-1.6.4.jar out/CQuests-1.6.4-source.zip out/CQuests-1.6.4-release.zip out/CQuests-1.6.4-CHECKSUMS.txt --target "$SOURCE_SHA" --title 'CQuests 1.6.4 - Clear quest home and next steps' --notes-file out/notes.md --draft
          test "$(gh release view v1.6.4 --json assets --jq '.assets | length')" = 4
          gh release edit v1.6.4 --draft=false --latest
          gh release view v1.6.4 --json url,isDraft,tagName,assets >> "$GITHUB_STEP_SUMMARY"
