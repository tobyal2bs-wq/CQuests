name: Publish CQuests 1.6.2

on:
  push:
    branches: [claude/project-thread-eax6qq]
    paths: [.github/workflows/release-1.6.2.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cquests-1.6.2
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 10e1623998663020cd28d44a0cb86510af630a20
      CHECKED_RUN: '41514742587'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 10e1623998663020cd28d44a0cb86510af630a20
      - name: Verify checked commit and collect its tested JAR
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN --jq '.conclusion')" = success
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN/jobs --jq '[.jobs[] | select(.conclusion != "success")] | length')" = 0
          if gh release view v1.6.2 >/dev/null 2>&1; then
            echo 'Release v1.6.2 already exists; refusing to replace it.' >&2
            exit 1
          fi
          gh run download "$CHECKED_RUN" --name CQuests --dir tested
          test -f tested/CQuests-1.6.2.jar
          grep -Fq 'version = "1.6.2"' build.gradle.kts
      - name: Package source, setup guide and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/bundle
          cp tested/CQuests-1.6.2.jar out/
          git archive --format=zip --prefix=CQuests/ --output=out/CQuests-1.6.2-source.zip HEAD
          cp out/CQuests-1.6.2.jar out/CQuests-1.6.2-source.zip MAIL-DIALOGUE-1.6.2.md DIALOGUE-FIX-1.6.1.md MERCHANTS-AND-AI-MAIL-1.6.0.md MAIL-AND-DISCOVERIES-1.5.0.md WORKSHOP-1.3.4.md ADVENTURES-1.4.0.md FARM-TESTING.md out/bundle/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          out=Path('out');bundle=out/'bundle'
          def digest(p,kind='sha256'):return hashlib.new(kind,p.read_bytes()).hexdigest()
          manifest={'version':'1.6.2','commit':os.environ['SOURCE_SHA'],'tested_jar_from_run':int(os.environ['CHECKED_RUN']),'github_actions':'https://github.com/'+os.environ['GH_REPO']+'/actions/runs/'+os.environ['CHECKED_RUN'],'unit_tests':114,'note':'JAR is downloaded unchanged from the successful build and server smoke-test run. Paper/Folia 26.2 native mail navigation and reply protocol checks without books or chest menus passed on local JAR SHA256 caede06eec26b402f0aec0477d41d115b5dd5d9f20a45c3bd829d361e3d07ec3. This CI-built artifact can differ in ZIP timestamps.','files':{p.name:{'bytes':p.stat().st_size,'sha256':digest(p),'sha1':digest(p,'sha1')} for p in sorted(bundle.iterdir())}}
          (bundle/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with zipfile.ZipFile(out/'CQuests-1.6.2-release.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(bundle.iterdir()):z.write(p,'CQuests-1.6.2/'+p.name)
          files=sorted(p for p in out.iterdir() if p.is_file())
          (out/'CQuests-1.6.2-CHECKSUMS.txt').write_text(''.join(f'SHA256 {digest(p)}  {p.name}\nSHA1   {digest(p,"sha1")}  {p.name}\n' for p in files))
          PY
          cat > out/notes.md <<'NOTES'
          Mail now uses the native Minecraft dialogue screen from inbox to reply.

          - `/quest mail` opens a clear letter list with sender, subject and NEW markers. Five letters per page, simple navigation, and a Close button.
          - Open a letter to see who sent it and when, plus readable pages with Next and Previous buttons. Reply opens a message box; press Send to send it.
          - Ordinary villager answers open immediately. Sent letters & replies also uses dialogues, with sender/recipient and dates. No book or inventory menu is required on supported Java clients.
          - B.O.B's Reply button is hidden until optional AI is configured. His letters and ordinary mail still work without AI. The AI composer keeps its Google disclosure.
          - Explicit book commands remain available by choice. Older or unsupported clients use locked inventory fallbacks and the existing suggested reply command. Mail eligibility is rechecked per player; saved dates, read status and correspondence are retained.
          - Includes the 1.6.1 letter-by-letter animation and click-to-advance fix. No player progress or settings reset.

          Validation: 114 unit tests, including inbox eligibility, dated letter/reply flow, immediate answers, and disabled B.O.B messaging. Local Paper/Folia 26.2 protocol tests exercised inbox/reader pagination, native reply input, sending and reading answers, history, unavailable-letter rejection and hidden B.O.B replies. The full normal flow emitted dialogue packets with zero book or inventory-window packets. The linked CI run passed build, Paper 1.21.4, Paper latest and Folia latest checks. No graphical-client or hosted-server review is claimed.
          https://github.com/tobyal2bs-wq/CQuests/actions/runs/41514742587

          Stop the server, back up CQuests data, replace the JAR and retain the data folder. See MAIL-DIALOGUE-1.6.2.md for the simpler player flow.

          The public JAR is downloaded unchanged from the successful CI run. Source, guides and SHA256/SHA1 checksums are included. Local protocol checks used the same source; the local JAR checksum is recorded in the manifest because ZIP timestamps can differ.
          NOTES
      - name: Create, verify and publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.6.2 out/CQuests-1.6.2.jar out/CQuests-1.6.2-source.zip out/CQuests-1.6.2-release.zip out/CQuests-1.6.2-CHECKSUMS.txt --target "$SOURCE_SHA" --title 'CQuests 1.6.2 - Simpler mail dialogues' --notes-file out/notes.md --draft
          test "$(gh release view v1.6.2 --json assets --jq '.assets | length')" = 4
          gh release edit v1.6.2 --draft=false --latest
          gh release view v1.6.2 --json url,isDraft,tagName,assets >> "$GITHUB_STEP_SUMMARY"
