name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build plugin and run tests
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CQuests
          path: build/libs/*.jar

  # Boots real servers with the plugin to make sure it loads, places its NPCs and reloads cleanly.
  server-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: paper, version: "1.21.4" }
          - { project: paper, version: "26.2" }
          - { project: paper, version: latest }
          - { project: folia, version: latest }
    name: server-test (${{ matrix.project }} ${{ matrix.version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # Newer Minecraft needs a newer Java; the plugin itself is built for Java 21.
          java-version: 25
      - uses: actions/download-artifact@v4
        with:
          name: CQuests
          path: build/libs
      - name: Start a server with CQuests
        run: .github/scripts/smoke-test.sh ${{ matrix.project }} ${{ matrix.version }}
