name: Publish CQuests 1.3.4

on:
  push:
    branches: [claude/project-thread-eax6qq]
    paths: [.github/workflows/release-1.3.4.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cquests-1.3.4
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: f99f1f86e006749ed25a11408cb80c92295ac8b7
      CHECKED_RUN: '41467604439'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: f99f1f86e006749ed25a11408cb80c92295ac8b7
      - name: Verify checked commit and collect its tested JAR
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN --jq '.conclusion')" = success
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN/jobs --jq '[.jobs[] | select(.conclusion != "success")] | length')" = 0
          if gh release view v1.3.4 >/dev/null 2>&1; then
            echo 'Release v1.3.4 already exists; refusing to replace it.' >&2
            exit 1
          fi
          gh run download "$CHECKED_RUN" --name CQuests --dir tested
          test -f tested/CQuests-1.3.4.jar
      - name: Package source, setup guide and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/bundle
          cp tested/CQuests-1.3.4.jar out/
          git archive --format=zip --prefix=CQuests/ --output=out/CQuests-1.3.4-source.zip HEAD
          cp out/CQuests-1.3.4.jar out/CQuests-1.3.4-source.zip MERCHANTS-1.3.md WORKSHOP-1.3.4.md FARM-TESTING.md out/bundle/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          out=Path('out');bundle=out/'bundle'
          def digest(p,kind='sha256'):return hashlib.new(kind,p.read_bytes()).hexdigest()
          manifest={'version':'1.3.4','commit':os.environ['SOURCE_SHA'],'tested_jar_from_run':int(os.environ['CHECKED_RUN']),'github_actions':'https://github.com/'+os.environ['GH_REPO']+'/actions/runs/'+os.environ['CHECKED_RUN'],'unit_tests':74,'note':'JAR is downloaded unchanged from the successful build and server smoke-test run. Paper/Folia 26.2 local protocol checks passed separately; the local JAR checksum may differ from this CI-built artifact.','files':{p.name:{'bytes':p.stat().st_size,'sha256':digest(p),'sha1':digest(p,'sha1')} for p in sorted(bundle.iterdir())}}
          (bundle/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with zipfile.ZipFile(out/'CQuests-1.3.4-release.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(bundle.iterdir()):z.write(p,'CQuests-1.3.4/'+p.name)
          files=sorted(p for p in out.iterdir() if p.is_file())
          (out/'CQuests-1.3.4-CHECKSUMS.txt').write_text(''.join(f'SHA256 {digest(p)}  {p.name}\nSHA1   {digest(p,"sha1")}  {p.name}\n' for p in files))
          PY
          cat > out/notes.md <<'NOTES'
          A clearer click-to-upgrade anvil and more natural NPC conversation menus.

          - Right-click the registered upgrade anvil: current hoe on the left, next tier on the right. Hover to compare XP, extra wheat, hit interval, level and price.
          - Review the next hoe, then click Buy. Repeated clicks on an old Buy button cannot start buying the following tier.
          - The locker explains where to collect your hoe. Your unlocked tiers and player progress are preserved.
          - Dialogue uses conversational replies, clearer quest details and a clearer leave option. The compatible book/menu controls have clearer labels; unavailable page responses are greyed out.
          - Overhead typing, reading pauses, quest gates, existing objectives and reward amounts are retained.

          Validation: 74 unit tests passed. CI passed Paper 1.21.4, Paper latest and Folia latest startup checks. Separate Paper/Folia 26.2 protocol clients exercised actual anvil opening, side-by-side hoe items, confirmation, exact single payment and repeated clicks. The existing farm, dialogue privacy, custom XP, merchant route/trade and replay checks also passed. No graphical Minecraft client review or custom hosted economy test is claimed.
          https://github.com/tobyal2bs-wq/CQuests/actions/runs/41467604439

          Administrator setup: place an anvil, look at it and run `/cq farm anvil` once. Players then simply right-click it. See WORKSHOP-1.3.4.md for the upgrade flow and FARM-TESTING.md for the existing farm-region setup.

          Install: stop the server, back up CQuests data, replace the old JAR and keep the data folder. Test the actual custom Vault economy on staging. Download the JAR to install, or the release ZIP for the JAR, source and guides. SHA256/SHA1 checksums are attached. The published JAR is downloaded unchanged from the successful CI run.
          NOTES
      - name: Create, verify and publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.3.4 out/CQuests-1.3.4.jar out/CQuests-1.3.4-source.zip out/CQuests-1.3.4-release.zip out/CQuests-1.3.4-CHECKSUMS.txt --target "$SOURCE_SHA" --title 'CQuests 1.3.4 - Fieldsmith upgrades and natural dialogue' --notes-file out/notes.md --draft
          test "$(gh release view v1.3.4 --json assets --jq '.assets | length')" = 4
          gh release edit v1.3.4 --draft=false --latest
          gh release view v1.3.4 --json url,isDraft,tagName,assets >> "$GITHUB_STEP_SUMMARY"
