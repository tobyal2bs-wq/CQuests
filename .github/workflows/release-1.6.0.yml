name: Publish CQuests 1.6.0

on:
  push:
    branches: [claude/project-thread-eax6qq]
    paths: [.github/workflows/release-1.6.0.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cquests-1.6.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: e0f13a142bf60751b6b7ff796bec74d976b2f08c
      CHECKED_RUN: '41501194831'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: e0f13a142bf60751b6b7ff796bec74d976b2f08c
      - name: Verify checked commit and collect its tested JAR
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN --jq '.conclusion')" = success
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN/jobs --jq '[.jobs[] | select(.conclusion != "success")] | length')" = 0
          if gh release view v1.6.0 >/dev/null 2>&1; then
            echo 'Release v1.6.0 already exists; refusing to replace it.' >&2
            exit 1
          fi
          gh run download "$CHECKED_RUN" --name CQuests --dir tested
          test -f tested/CQuests-1.6.0.jar
          grep -Fq 'version = "1.6.0"' build.gradle.kts
      - name: Package source, setup guide and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/bundle
          cp tested/CQuests-1.6.0.jar out/
          git archive --format=zip --prefix=CQuests/ --output=out/CQuests-1.6.0-source.zip HEAD
          cp out/CQuests-1.6.0.jar out/CQuests-1.6.0-source.zip MERCHANTS-AND-AI-MAIL-1.6.0.md MAIL-AND-DISCOVERIES-1.5.0.md WORKSHOP-1.3.4.md ADVENTURES-1.4.0.md FARM-TESTING.md out/bundle/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          out=Path('out');bundle=out/'bundle'
          def digest(p,kind='sha256'):return hashlib.new(kind,p.read_bytes()).hexdigest()
          manifest={'version':'1.6.0','commit':os.environ['SOURCE_SHA'],'tested_jar_from_run':int(os.environ['CHECKED_RUN']),'github_actions':'https://github.com/'+os.environ['GH_REPO']+'/actions/runs/'+os.environ['CHECKED_RUN'],'unit_tests':104,'note':'JAR is downloaded unchanged from the successful build and server smoke-test run. Paper/Folia 26.2 protocol and restart checks passed on local JAR SHA256 9aa564383bf51a03953c1285c21e550da799fe53aa1915d67ca9db0ea1ea15af. This CI-built artifact can differ in ZIP timestamps.','files':{p.name:{'bytes':p.stat().st_size,'sha256':digest(p),'sha1':digest(p,'sha1')} for p in sorted(bundle.iterdir())}}
          (bundle/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with zipfile.ZipFile(out/'CQuests-1.6.0-release.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(bundle.iterdir()):z.write(p,'CQuests-1.6.0/'+p.name)
          files=sorted(p for p in out.iterdir() if p.is_file())
          (out/'CQuests-1.6.0-CHECKSUMS.txt').write_text(''.join(f'SHA256 {digest(p)}  {p.name}\nSHA1   {digest(p,"sha1")}  {p.name}\n' for p in files))
          PY
          cat > out/notes.md <<'NOTES'
          Native villager trading and private correspondence, with optional Gemini replies from B.O.B.

          - Merchants use the vanilla villager trade window. Select an offer and left-click its result once; costs come from the real inventory, Vault balance and sunflower pouch. Full combined prices are in the tooltips. One successful purchase closes the window. Shift-click bulk trading is disabled.
          - Locked previews cannot be traded as real ingredients or collected as rewards. Purchases retain range, revision, capacity, balance and replay checks; merchant editing remains OP-only.
          - `/quest mail` shows the sender and a saved UTC delivery time. Open a letter in a native dialogue, read it as a book, or write a reply. Older clients have book and command fallbacks. `/quest mail replies` opens saved correspondence.
          - Ordinary villagers give editable authored replies without AI. Existing letters receive their first delivery timestamp after upgrading; old dates cannot be reconstructed.
          - Gemini is optional and disabled by default. Quests, farming, merchants and ordinary mail work without any AI configuration. Only sending messages to B.O.B is unavailable until the operator supplies a model, server environment key and character file, then enables it.
          - B.O.B uses the supplied persona and saved quest context at request time, not a newly trained model. Generation has bounded workers, timeouts and persisted daily quotas. Replies are plain text and cannot execute commands or grant rewards. No live Gemini request or character-quality assessment was performed; the real character notes are still pending.

          Validation: 104 unit tests, plus the linked successful Paper 1.21.4, Paper latest and Folia latest CI run. Local Paper/Folia 26.2 protocol tests cover native trade selection, repeated purchase packets, preview extraction attempts, token payments, dated mail dialogues, books, reply inputs and ordinary replies with AI disabled. Restart checks verify saved correspondence and cleanup after quitting with a trade window open. No graphical client or hosted custom-economy verification is claimed.
          https://github.com/tobyal2bs-wq/CQuests/actions/runs/41501194831

          Stop the server, back up CQuests data, replace the JAR and retain the data folder. Read MERCHANTS-AND-AI-MAIL-1.6.0.md for trading, mail and optional Gemini setup. Player inventories, external balances and asynchronous plugin saves do not share a crash-atomic transaction.

          The public JAR is downloaded unchanged from the successful CI run. Source, guides and SHA256/SHA1 checksums are included. Local runtime checks used the same plugin source and the JAR hash recorded in the manifest; ZIP timestamps can differ from the CI-built JAR.
          NOTES
      - name: Create, verify and publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.6.0 out/CQuests-1.6.0.jar out/CQuests-1.6.0-source.zip out/CQuests-1.6.0-release.zip out/CQuests-1.6.0-CHECKSUMS.txt --target "$SOURCE_SHA" --title 'CQuests 1.6.0 - Native merchants and replyable letters' --notes-file out/notes.md --draft
          test "$(gh release view v1.6.0 --json assets --jq '.assets | length')" = 4
          gh release edit v1.6.0 --draft=false --latest
          gh release view v1.6.0 --json url,isDraft,tagName,assets >> "$GITHUB_STEP_SUMMARY"
