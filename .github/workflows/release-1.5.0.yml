name: Publish CQuests 1.5.0

on:
  push:
    branches: [claude/project-thread-eax6qq]
    paths: [.github/workflows/release-1.5.0.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cquests-1.5.0
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 99604b425be90f64b5e52cd29b91c083d526b0dd
      CHECKED_RUN: '41492018607'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 99604b425be90f64b5e52cd29b91c083d526b0dd
      - name: Verify checked commit and collect its tested JAR
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN --jq '.conclusion')" = success
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN/jobs --jq '[.jobs[] | select(.conclusion != "success")] | length')" = 0
          if gh release view v1.5.0 >/dev/null 2>&1; then
            echo 'Release v1.5.0 already exists; refusing to replace it.' >&2
            exit 1
          fi
          gh run download "$CHECKED_RUN" --name CQuests --dir tested
          test -f tested/CQuests-1.5.0.jar
      - name: Package source, setup guide and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/bundle
          cp tested/CQuests-1.5.0.jar out/
          git archive --format=zip --prefix=CQuests/ --output=out/CQuests-1.5.0-source.zip HEAD
          cp out/CQuests-1.5.0.jar out/CQuests-1.5.0-source.zip MAIL-AND-DISCOVERIES-1.5.0.md WORKSHOP-1.3.4.md ADVENTURES-1.4.0.md FARM-TESTING.md out/bundle/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          out=Path('out');bundle=out/'bundle'
          def digest(p,kind='sha256'):return hashlib.new(kind,p.read_bytes()).hexdigest()
          manifest={'version':'1.5.0','commit':os.environ['SOURCE_SHA'],'tested_jar_from_run':int(os.environ['CHECKED_RUN']),'github_actions':'https://github.com/'+os.environ['GH_REPO']+'/actions/runs/'+os.environ['CHECKED_RUN'],'unit_tests':93,'note':'JAR is downloaded unchanged from the successful build and server smoke-test run. Paper/Folia 26.2 protocol and restart checks passed on local JAR SHA256 0f21f63c25d96d3f6168d92a756348b76670c916f84f9dabba9780517a0828e9. This CI-built artifact can differ in ZIP timestamps.','files':{p.name:{'bytes':p.stat().st_size,'sha256':digest(p),'sha1':digest(p,'sha1')} for p in sorted(bundle.iterdir())}}
          (bundle/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with zipfile.ZipFile(out/'CQuests-1.5.0-release.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(bundle.iterdir()):z.write(p,'CQuests-1.5.0/'+p.name)
          files=sorted(p for p in out.iterdir() if p.is_file())
          (out/'CQuests-1.5.0-CHECKSUMS.txt').write_text(''.join(f'SHA256 {digest(p)}  {p.name}\nSHA1   {digest(p,"sha1")}  {p.name}\n' for p in files))
          PY
          cat > out/notes.md <<'NOTES'
          Personal letters and field discoveries connect the villagers' stories to the player's choices.

          - `/quest mail`: a private paginated mailbox with readable letters. Steve and Ned react to decisions involving their relatives; Pip and the field villagers write as the journey progresses. Letters have saved read status and never pay repeatable rewards.
          - `/quest discoveries`: sunflower tokens and farming discoveries. Each 750 successful farm wheat harvests earns one token in a UUID-bound pouch. Ordinary sunflowers, copied inventory icons, deaths and story resets cannot replenish spent currency. Existing recorded harvests count.
          - Flora is the sixth editable merchant. Place her with `/cq merchant spawn flora`, mark the trail with `/cq merchant wand flora`, then `/cq merchant end flora`. She walks and speaks before opening her store. Her example trades use sunflower tokens.
          - OP-only merchant editors support a sunflower price at slot 33 alongside the existing exact item and Vault money costs. Reach, revisions, complete inventory capacity and confirmation replay guards remain in place.
          - `/cq character <id>` customises quest NPCs, merchants and Pip: names, titles, prefixes, nameplate layouts, chat speaker prefixes, first-meeting and idle dialogue. MiniMessage and legacy colours use the existing parser. Edits refresh labels without replacing quest IDs; non-OPs cannot change them. Configuration is saved in characters.yml.
          - Pip's later arrival lines reflect remembered decisions. Resetting a custom companion name restores the original nameplate definition. Mail uses the established Adventure book path across Paper and Folia.

          Validation: 93 unit tests and the linked successful Paper 1.21.4, Paper latest and Folia latest CI run. Separate local Paper/Folia 26.2 protocol tests cover actual letter book packets, accepted harvest tokens, ordinary sunflower rejection, editable token prices, repeated purchase packets, OP checks and the existing farm/merchant/companion/Wither tests. Full restart tests verify spent tokens, read letters, character styles, merchant prices and existing quest state. No graphical client or hosted custom-economy verification is claimed.
          https://github.com/tobyal2bs-wq/CQuests/actions/runs/41492018607

          Stop the server, back up CQuests data, replace the JAR and keep the data folder. Read MAIL-AND-DISCOVERIES-1.5.0.md for commands, prices, editable letters and cosmetics. Tokens are banked rather than transferable inventory flowers. Normal asynchronous plugin saves, server inventories and external balances do not provide a shared crash-atomic transaction.

          The public JAR is downloaded unchanged from the successful CI run. Source, guides and SHA256/SHA1 checksums are included. Local runtime checks used the same source and the JAR hash recorded in the manifest; ZIP timestamps can differ from the CI-built JAR.
          NOTES
      - name: Create, verify and publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.5.0 out/CQuests-1.5.0.jar out/CQuests-1.5.0-source.zip out/CQuests-1.5.0-release.zip out/CQuests-1.5.0-CHECKSUMS.txt --target "$SOURCE_SHA" --title 'CQuests 1.5.0 - Letters, sunflower discoveries and editable NPCs' --notes-file out/notes.md --draft
          test "$(gh release view v1.5.0 --json assets --jq '.assets | length')" = 4
          gh release edit v1.5.0 --draft=false --latest
          gh release view v1.5.0 --json url,isDraft,tagName,assets >> "$GITHUB_STEP_SUMMARY"
