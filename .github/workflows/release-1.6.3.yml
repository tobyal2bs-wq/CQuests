name: Publish CQuests 1.6.3

on:
  push:
    branches: [claude/project-thread-eax6qq]
    paths: [.github/workflows/release-1.6.3.yml]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-cquests-1.6.3
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      SOURCE_SHA: 4c92ebbf97116e00e573a0cb007a30cb49d64328
      CHECKED_RUN: '41604575690'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: 4c92ebbf97116e00e573a0cb007a30cb49d64328
      - name: Verify checked commit and collect its tested JAR
        shell: bash
        run: |
          set -euo pipefail
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN --jq '.head_sha')" = "$SOURCE_SHA"
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN --jq '.conclusion')" = success
          test "$(gh api repos/$GH_REPO/actions/runs/$CHECKED_RUN/jobs --jq '[.jobs[] | select(.conclusion != "success")] | length')" = 0
          if gh release view v1.6.3 >/dev/null 2>&1; then
            echo 'Release v1.6.3 already exists; refusing to replace it.' >&2
            exit 1
          fi
          gh run download "$CHECKED_RUN" --name CQuests --dir tested
          test -f tested/CQuests-1.6.3.jar
          grep -Fq 'version = "1.6.3"' build.gradle.kts
      - name: Package source, setup guide and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p out/bundle
          cp tested/CQuests-1.6.3.jar out/
          git archive --format=zip --prefix=CQuests/ --output=out/CQuests-1.6.3-source.zip HEAD
          cp out/CQuests-1.6.3.jar out/CQuests-1.6.3-source.zip OPTIMISATION-1.6.3.md MAIL-DIALOGUE-1.6.2.md DIALOGUE-FIX-1.6.1.md MERCHANTS-AND-AI-MAIL-1.6.0.md MAIL-AND-DISCOVERIES-1.5.0.md WORKSHOP-1.3.4.md ADVENTURES-1.4.0.md FARM-TESTING.md out/bundle/
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,zipfile
          out=Path('out');bundle=out/'bundle'
          def digest(p,kind='sha256'):return hashlib.new(kind,p.read_bytes()).hexdigest()
          manifest={'version':'1.6.3','commit':os.environ['SOURCE_SHA'],'tested_jar_from_run':int(os.environ['CHECKED_RUN']),'github_actions':'https://github.com/'+os.environ['GH_REPO']+'/actions/runs/'+os.environ['CHECKED_RUN'],'unit_tests':117,'note':'JAR is downloaded unchanged from the successful build and server smoke-test run. Paper/Folia 26.2 farm, idle conversation, animation and native mail regression checks passed on local JAR SHA256 869cf0331e1374379edece39ba0791869a6ec1c24fc827719f7e9c8d8cbb5d21. This CI-built artifact can differ in ZIP timestamps.','files':{p.name:{'bytes':p.stat().st_size,'sha256':digest(p),'sha1':digest(p,'sha1')} for p in sorted(bundle.iterdir())}}
          (bundle/'MANIFEST.json').write_text(json.dumps(manifest,indent=2)+'\n')
          with zipfile.ZipFile(out/'CQuests-1.6.3-release.zip','w',zipfile.ZIP_DEFLATED) as z:
              for p in sorted(bundle.iterdir()):z.write(p,'CQuests-1.6.3/'+p.name)
          files=sorted(p for p in out.iterdir() if p.is_file())
          (out/'CQuests-1.6.3-CHECKSUMS.txt').write_text(''.join(f'SHA256 {digest(p)}  {p.name}\nSHA1   {digest(p,"sha1")}  {p.name}\n' for p in files))
          PY
          cat > out/notes.md <<'NOTES'
          Targeted optimisations without changing quests, rewards or saved progress.

          - The display loop reuses one farm membership result instead of checking the same boundary twice. Harvest and tool/command restrictions retain their own checks.
          - Regrowth saves skip YAML serialisation and file replacement when the pending crop set is unchanged. Failed writes still retry; changes and the shutdown drain still persist.
          - Opening an already delivered inbox and rereading letters no longer queue redundant player snapshots. First deliveries, first reads and new correspondence save normally.
          - Overhead speech uses direct plain-text components instead of parsing MiniMessage for every character. Authored chat formatting is retained.
          - After the continue prompt finishes typing, idle conversation checks fall from 20 to 2 per second. Clicks remain immediate; active animation is unchanged. Idle departure/timeout cleanup can take up to half a second.

          Validation: 117 unit tests, including 50 identical regrowth snapshots without file replacement, changed crops, shutdown persistence, failed-write retry and repeated mail navigation followed by a saved reply. Local Paper/Folia 26.2 tests cover idle scheduling and direct continuation, repeated harvest requests crediting one crop, separate skill XP, mature regrowth and bound-tool cleanup. Letter animation and the complete native mail flow were rerun on both engines. The linked CI run passed build, Paper 1.21.4, Paper latest and Folia latest checks.
          https://github.com/tobyal2bs-wq/CQuests/actions/runs/41604575690

          These are reductions in specific repeated operations, not a measured hosted-server TPS improvement or a zero-lag guarantee. No live server load profile or graphical-client review was performed.

          Stop the server, back up CQuests data, replace the JAR and keep the data folder. See OPTIMISATION-1.6.3.md. No reset or configuration migration is required; optional AI remains disabled by default.

          The public JAR is downloaded unchanged from the successful CI run. Source, guides and SHA256/SHA1 checksums are included. Local protocol checks used the same source; the manifest records the local JAR hash because ZIP timestamps can differ.
          NOTES
      - name: Create, verify and publish release
        shell: bash
        run: |
          set -euo pipefail
          gh release create v1.6.3 out/CQuests-1.6.3.jar out/CQuests-1.6.3-source.zip out/CQuests-1.6.3-release.zip out/CQuests-1.6.3-CHECKSUMS.txt --target "$SOURCE_SHA" --title 'CQuests 1.6.3 - Less repeated work and fewer redundant saves' --notes-file out/notes.md --draft
          test "$(gh release view v1.6.3 --json assets --jq '.assets | length')" = 4
          gh release edit v1.6.3 --draft=false --latest
          gh release view v1.6.3 --json url,isDraft,tagName,assets >> "$GITHUB_STEP_SUMMARY"
