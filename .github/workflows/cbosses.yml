name: CBosses

on:
  push:
    paths: ["cbosses/**", ".github/workflows/cbosses.yml"]
  pull_request:
    paths: ["cbosses/**", ".github/workflows/cbosses.yml"]

defaults:
  run:
    working-directory: cbosses

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build CBosses and run its tests
        run: ./gradlew build --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: CBosses
          path: cbosses/build/libs/*.jar

  # Boots a real server with CBosses: every boss appears, runs every attack and plays its death.
  server-test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { project: paper, version: "1.21.4" }
          - { project: paper, version: latest }
          - { project: folia, version: latest }
    name: server-test (${{ matrix.project }} ${{ matrix.version }})
    env:
      CB_ROOT: ${{ github.workspace }}/cbosses
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
      - uses: actions/download-artifact@v4
        with:
          name: CBosses
          path: cbosses/build/libs
      - name: Start a server with CBosses
        run: .github/scripts/smoke-test.sh ${{ matrix.project }} ${{ matrix.version }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cbosses-server-log-${{ matrix.project }}-${{ matrix.version }}
          path: cbosses/run/server.log
