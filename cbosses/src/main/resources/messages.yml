# Every chat line CBosses sends, in MiniMessage (https://docs.advntr.dev/minimessage/format.html).
# Placeholders: <boss>, <minutes>, <where>, <title>, <player>, <seconds>.
prefix: "<dark_gray>[<gold>CBosses</gold>]</dark_gray> "
schedule-warning: "<gold><bold>⚔ BOSS</bold></gold> <boss> <gray>wakes in <white><minutes> minutes</white><where>"
spawn-broadcast: "<dark_gray><st>                                        </st>\n<gold><bold>⚔ WORLD BOSS ⚔</bold></gold>  <boss>\n<title>\n<gold>has risen<where>\n<gray>Everyone who helps gets a reward; the top 3 by damage get more.\n<dark_gray><st>                                        </st>"
boss-idle: "<gray><boss> <gray>found no challengers and left."
boss-timeout: "<gray><boss> <gray>was not beaten in time and vanished."
boss-stopped: "<gray><boss> <gray>was sent away."
chapter-boss-warning: "<gold>⚔ <boss> <gray>is coming for you in <white><seconds></white> seconds. Get ready!"
chapter-boss-started: "<gold>⚔ <boss> <gold>has come for you! <gray>Beat it to claim the chapter reward. Leave the circle or die and it leaves."
chapter-boss-left: "<gray><boss> <gray>left. Fight it again with <yellow>/cbosses chapter retry</yellow>."
chapter-boss-waiting: "<gold><boss> <gray>is still waiting for you. <yellow>/cbosses chapter retry</yellow> when you are ready."
chapter-boss-beaten: "<gold>⚔ <white><player></white> <gray>defeated the chapter boss <boss><gray>!"

# ---------------------------------------------------------------- every other line
# Every other line CBosses shows: command replies, the menu, action bars, titles and the defeat broadcast.
# Change any of them. Words in <angle brackets> that are not colours are filled in by the plugin
# (for example <boss>, <player>, <arena>, <label> for the command name). Boss names, titles and
# descriptions are in bosses.yml.
text:
  # chapter bosses
  chapter:
    a-chapter-boss-wants-to: "<gray>A chapter boss wants to fight you, but bosses are off in this world. <yellow>/cbosses chapter retry</yellow> somewhere else."
    a-great-evil-stirs: "<dark_red><bold>A GREAT EVIL STIRS"
    chapter-boss: "<gold><bold>CHAPTER BOSS"
    defeated-the-chapter-boss: "<gold>⚔ <white><player></white> <gray>defeated the chapter boss <boss><gray>!"
    in: "<boss> <gray>in <white><left>"
    is-coming-for-you-in: "<gold>⚔ <boss> <gray>is coming for you in <white><seconds></white> seconds. Get ready!"
    is-still-waiting-for-you: "<gold><boss> <gray>is still waiting for you. <yellow>/cbosses chapter retry</yellow> when you are ready."
    list-head: "<gold>Chapter bosses <gray>(swap with /cbosses chapter swap <a> <b>):"
    list-line: "<gray>  <white><n></white>: <boss> <dark_gray><how>"
    the-chapter-boss-could-not: "<gray>The chapter boss could not appear here. <yellow>/cbosses chapter retry</yellow> somewhere open."
  # commands
  command:
    arena-setspawn-wand-show-region: "<yellow>/<label> arena setspawn|wand|show|region|radius|clear|delete|list <arena>"
    cbosses-commands: "<gold>CBosses commands"
    chapter-boss-coming: "<green>Chapter <n> boss is coming for <player>."
    chapter-bosses-reset-for: "<gray>Chapter bosses reset for <input2>."
    chapter-must-be-a-number: "<red>Chapter must be a number."
    chapter-reset-retry: "<yellow>/<label> chapter <player> <chapter> <gray>| bosses | set <chapter> <boss|default> | swap <a> <b> | reset <player> | retry"
    chapter-set: "<green>Chapter <n> boss set. Player progress is kept."
    chapter-swap-missing: "<red>Both chapters need a boss."
    chapter-swapped: "<green>Swapped the bosses of chapters <a> and <b>. Player progress is kept."
    disabled-list: "<gray>Turned off: <white><list>"
    edit-usage: "<yellow>/<label> edit <boss> [<field> <value>] <gray>fields: <list>"
    every-boss-was-sent-away: "<gray>Every boss was sent away."
    finale-already: "<gray>The finale is already on its way, or its boss is missing."
    finale-reset: "<gray>Finale progress reset: every legend must be beaten again."
    finale-waking: "<light_purple>The finale is waking."
    help:
      arena: " <yellow><cmd> arena setspawn|wand|region|radius|show|clear|delete <arena>"
      chapter: " <yellow><cmd> chapter <player> <n> | reset <player> | retry"
      decor: " <yellow><cmd> decor place <model>|remove|list <gray>pumpkins and other models that sit and pull faces"
      disable: " <yellow><cmd> enable|disable <boss> <gray>turn a boss on or off (no name: list the ones that are off)"
      edit: " <yellow><cmd> edit <boss> [field value] <gray>change name, color #hex [#hex], health, damage, bar, tier, evolve..."
      finale: " <yellow><cmd> finale [wake|reset] <gray>the boss after the three legends"
      list: " <yellow><cmd> list <gray>boss ids"
      menu: " <yellow><cmd> menu <gray>every boss in a menu"
      minis: " <yellow><cmd> minis <gray>mini boss spots, timer, mode and markers"
      mythic: " <yellow><cmd> mythic [add|remove <boss>] <gray>choose which bosses are mythic"
      reload: " <yellow><cmd> reload"
      schedule: " <yellow><cmd> schedule on|off <gray>the weekly boss"
      season: " <yellow><cmd> season <id> on|off|auto"
      selftest: " <yellow><cmd> selftest <gray>spawn every boss, run every attack and death"
      settings: " <yellow><cmd> settings [page] <gray>every option in a settings screen | settings set <path> <value>"
      spawn: " <yellow><cmd> spawn <boss> [arena|here] <gray>start a real fight (here: where you stand)"
      stop: " <yellow><cmd> stop [arena|boss] <gray>send bosses away"
      test: " <yellow><cmd> test <boss>|phase|stop <gray>try a boss in front of you, nothing is paid"
    is-not-online: "<red><input> is not online."
    is-rising-at: "<green><boss> <green>is rising at <arena>."
    mythic-list: "<light_purple>Mythic bosses: <white><list> <gray>(/<label> mythic add|remove <boss>; their extra damage, health and evolving are under mythic: in config.yml)"
    no-arena: "<red>No arena <arena>"
    no-arena-2: "<red>No arena <id>"
    no-boss: "<red>No boss <input>"
    no-boss-for-chapter: "<red>No boss for chapter <n>."
    no-chapter-boss-is-waiting: "<gray>No chapter boss is waiting for you."
    nothing-to-stop-called: "<gray>Nothing to stop called <input>."
    players-only: "<red>Players only."
    players-only-console-can-run: "<red>Players only. Console can run /<label> selftest."
    radius-must-be-a-number: "<red>Radius must be a number."
    reloaded-bosses: "<green>Reloaded: <count> bosses."
    running-the-boss-self-test: "<gray>Running the boss self-test near the world spawn (takes about a minute)..."
    spawn-arena: "<yellow>/<label> spawn <boss> [arena]"
    test-phase-stop: "<yellow>/<label> test <boss>|phase|stop"
    they-already-have-a-boss: "<yellow>They already have a boss coming."
    you-can-t-use-that: "<red>You can't use that. <gray>Try /<label> next"
    you-have-no-test-boss: "<gray>You have no test boss."
  # decor
  decor:
    list: "<yellow>Decorations: <white><count></white> <gray>· models: <white><list>"
    models: "<yellow>/<label> decor place <model> <gray>Models: <white><list>"
    none: "<red>No decoration within 6 blocks. <gray>/<label> decor remove <id>"
    placed: "<green>Placed <white><model></white> (<id>). <gray>Remove it with /<label> decor remove"
    removed: "<gray>Removed <white><id></white>."
  # edit
  edit:
    allowed: "<red><field> must be one of: <list>"
    fields: "<red>Fields: <list>"
    header: "<gold>Boss <white><id></white> <gray>(change with /cbosses edit <id> <field> <value>)"
    no-boss: "<red>No boss <id> in bosses.yml."
    number: "<red><field> needs a number of 0 or more (health at least 20; evolve 0 to 1, true or false)."
    save-failed: "<red>Could not save bosses.yml: <error>"
    saved: "<green>Saved <white><id></white> <field> = <white><value></white>. <gray>New fights use it; running fights keep their old values."
  # fights, arenas and rewards
  fight:
    a-boss-is-already-alive: "<yellow>A boss is already alive in <arena>. /cbosses stop <arena>"
    another-plugin-stopped-the-boss: "<yellow>Another plugin stopped the boss from spawning."
    arena: "<gray>Arena <white><arena></white>: <border>."
    arena-circle-radius-used-when: "<gray>Arena <white><arena></white> circle radius: <radius> (used when there is no outline or region)."
    arena-deleted: "<gray>Arena <white><arena></white> deleted."
    arena-has-no-spawn-cbosses: "<yellow>Arena <arena> has no spawn. /cbosses arena setspawn <arena>"
    arena-no-longer-uses-a: "<gray>Arena <white><arena></white> no longer uses a WorldGuard region. Border: <border>."
    arena-now-uses-the-worldguard: "<green>Arena <white><arena></white> now uses the WorldGuard region <white><region></white> as its border."
    armour: "<gray>Armour"
    blocked-by-its-weapon: "<gray>Blocked by its weapon"
    border: "<white><arena> <gray><player>, border: <border><alive>"
    border-cleared-arena-now-uses: "<gray>Border cleared. Arena <white><arena></white> now uses <border>."
    border-rod-for-arena-left: "<gold>Border rod for arena <white><arena></white>. <gray>Left-click blocks around the arena to add corners in order. The boss can never walk past this outline."
    boss-border-rod: "<gold><bold>Boss Border Rod</bold></gold> <gray>(<arena>)"
    boss-reward-in-damage: "<gold>Boss reward: <white>#<place></white> in damage<amount><items>."
    boss-spawn-for-arena-set: "<green>Boss spawn for arena <white><arena></white> set here. <gray>Border: <border>. Draw one with <yellow>/cbosses arena wand <arena></yellow> or link a WorldGuard region with <yellow>/cbosses arena region <arena> <region></yellow>."
    boss-wakes-in-minutes: "<gold><bold>⚔ BOSS</bold></gold> <boss> <gray>wakes in <white><minutes> minutes</white><where>"
    bosses: "<gold>Bosses</gold> <gray>(<count>)"
    bosses-are-off-in-this: "<yellow>Bosses are off in this world (fight.disabled-worlds)."
    bosses-cannot-appear-in-a: "<yellow>Bosses cannot appear in a Peaceful world."
    cbosses-is-turned-off-enabled: "<yellow>CBosses is turned off (enabled: false)."
    cbosses-test-bosses: "<yellow>/cbosses test <boss></yellow> <gray>Bosses: <white><list>"
    chapter: "<gold>Chapter "
    corner-at: "<green>Corner <n></green> <gray>at <getx>, <getz><problem>"
    could-not-appear-here: "<yellow><boss> <yellow>could not appear here: <getmessage>"
    defeat-broadcast: "<line>\n<gold><bold>⚔ BOSS DEFEATED ⚔</bold></gold>\n<boss> <gray>was slain<killer><gray>!\n<rows><line>"
    defeat-killer: " by <white><player></white>"
    defeat-row: "<medal> <white><player> <gray><damage> damage <dark_gray>(<percent>%)"
    evolved: "<dark_red><bold>⬆</bold> <boss> <red>evolved! <gray>Stage <stage>: it hits <percent>% harder."
    fighting-bosses-is-off-here: "<red>Fighting bosses is off here."
    found-no-challengers-and-left: "<gray><boss> <gray>found no challengers and left."
    has-come-for-you-beat: "<gold>⚔ <boss> <gold>has come for you! <gray>Beat it to claim the chapter reward. Leave the circle or die and it leaves."
    head-hit: "<gold>Head hit"
    heals-itself: "<boss> <green>heals itself!"
    helmet: "<yellow>Helmet"
    is-alive-now: "<gold>⚔ <boss> <gold>is alive now<where>"
    is-defeated-you-placed: "<boss> <gray>is defeated. You placed <white>#<place>"
    is-desperate: "<dark_red><bold>is desperate!"
    is-enraged: "<red><bold>is enraged!"
    left-click-a-block-add: "<yellow>Left-click a block</yellow><gray>: add a corner"
    left-fight-it-again-with: "<gray><boss> <gray>left. Fight it again with <yellow>/cbosses chapter retry</yellow>."
    next-boss-in: "<gold>Next boss: </gold><boss> <gray><title> <gray>in <white><time></white> <dark_gray>(<charat><root> <tolocaltime>)<where>"
    no-arena: "<red>No arena <arenaid>"
    no-arena-cbosses-arena-setspawn: "<red>No arena <arenaid>. <gray>/cbosses arena setspawn <arenaid>"
    no-arenas-yet-stand-where: "<yellow>No arenas yet. Stand where the boss should appear and run /cbosses arena setspawn main."
    no-boss-cbosses-list: "<red>No boss <bossid>. <gray>/cbosses list"
    no-boss-is-scheduled: "<gray>No boss is scheduled."
    no-corners-to-remove: "<gray>No corners to remove."
    no-worldguard-region-called-in: "<red>No WorldGuard region called <region> in <world>."
    nobody: "<gray>nobody"
    nobody-hurt-it: "<gray>Nobody hurt it."
    partner-rage: "<dark_red><bold>⬆</bold> <boss> <red>is enraged by the fall of its partner! <gray>It hits <percent>% harder."
    removed-the-last-corner: "<yellow>Removed the last corner. <gray><left> left."
    right-click-remove-the-last: "<yellow>Right-click</yellow><gray>: remove the last corner"
    sneak-right-click-show-the: "<yellow>Sneak + right-click</yellow><gray>: show the border"
    something-stopped-the-boss-from: "<yellow>Something stopped the boss from appearing (another plugin or a protected area)."
    step-inside-the-arena-to: "<red>Step inside the arena to hurt <boss>"
    test-boss-beaten-top-damage: "<green>Test boss beaten. <gray>Top damage: <ranked>"
    test-boss-ended: "<gray>Test boss ended (<reason>)."
    test-boss-nothing-is-paid: "<gray>Test boss: <boss> <gray>(<id>). Nothing is paid. <yellow>/cbosses test phase</yellow> jumps to the next phase, <yellow>/cbosses test stop</yellow> ends it."
    the-border-must-be-in: "<red>The border must be in the same world as the arena spawn."
    the-worldguard-flag-cbosses-spawn: "<yellow>The WorldGuard flag cbosses-spawn is set to deny here."
    this-is-someone-else-s: "<red>This is someone else's chapter boss."
    too-many-bosses-are-alive: "<yellow>Too many bosses are alive at once (fight.max-active)."
    victory: "<gold><bold>VICTORY"
    was-not-beaten-in-time: "<gray><boss> <gray>was not beaten in time and vanished."
    was-sent-away: "<gray><boss> <gray>was sent away."
    weak-spot: "<light_purple><bold>Weak spot!"
    weekly-boss: "<gray>Weekly boss: <white><off>"
    world-boss-has-risen-everyone: "<dark_gray><st>                                        </st>\n<gold><bold>⚔ WORLD BOSS ⚔</bold></gold>  <boss>\n<title>\n<gold>has risen<where>\n<gray>Everyone who helps gets a reward; the top 3 by damage get more.\n<dark_gray><st>                                        </st>"
    worldguard-is-not-running-on: "<red>WorldGuard is not running on this server."
  # the finale
  finale:
    info: "<light_purple>Finale</light_purple> <gray>(<state>): <boss> <gray>wakes after <legends>"
    progress: "<dark_purple>✦ <boss> <gray>has fallen. <white><left></white> <gray>legend(s) still stand before <light_purple>something wakes</light_purple>."
    warning: "<dark_gray><st>                                        </st>\n<light_purple><bold>✦ THE LEGENDS HAVE FALLEN ✦</bold></light_purple>\n<gray>Something older than all of them is waking...\n<boss> <gray>arrives in <white><seconds></white> seconds<where>.\n<dark_gray><st>                                        </st>"
    where: " <gray>at <white><x> <y> <z></white> in <white><world></white>"
  # the boss menu
  menu:
    bosses: "<dark_gray>Bosses <gray>(<page>/<pages>)"
    chapter: "<aqua>Chapter "
    health-attacks: "<gray>Health <white><health></white>  Attacks <white><size></white>  <movement>"
    left-click-spawn-here: "<yellow>Left-click</yellow> <gray>spawn it where you stand (real fight)"
    mini: "<yellow>Mini boss"
    next-page: "<yellow>Next page"
    next-weekly-boss: "<gold>Next weekly boss: <white>"
    previous-page: "<yellow>Previous page"
    right-click-spawn-at-the: "<yellow>Right-click</yellow> <gray>spawn at the main arena"
    seasonal: "<light_purple>Seasonal: "
    shift-click-test: "<yellow>Shift-left</yellow> <gray>test it in front of you (no rewards)"
    world-boss: "<gold>World boss"
