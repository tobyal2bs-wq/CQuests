  mini:
    added: "<green>Spot <white><id></white> added where you stand."
    awake: "<yellow><bold>✦ MINI BOSS</bold></yellow> <boss> <gray>woke at <white><x>, <z></white> (<world>)."
    info: "<yellow>Mini bosses <white><state></white> <gray>· mode <white><mode></white> · every <white><every>m</white> · next in <white><next></white> · alive <white><alive>/<max></white> · spots <white><spots></white> · minis <white><count></white>"
    markers-off: "<gray>Spot markers off."
    markers-on: "<green>Spot markers on."
    menu: "<dark_gray>Mini bosses"
    no-spot: "<red>No spot there. <gray>/<label> minis remove <id>"
    none: "<yellow>No mini could wake (max alive reached, no spots or no minis)."
    removed: "<gray>Spot <white><id></white> removed."
    spot-line: " <gray>• <white><id></white> <world> <x> <y> <z> r<radius><off><bosses>"
    warning: "<yellow><bold>✦ MINI BOSS</bold></yellow> <gray>Something small and angry wakes in <white><seconds>s</white>."
