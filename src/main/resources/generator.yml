# Side quest and daily quest generator.
#
# Every story villager hands out side-quests-per-npc side quests, one after another, once you have
# finished their story quest. 100 story villagers x 10,000 = 1,000,000 side quests. They are built on
# demand from the seed, so a big number costs no memory or startup time. Quest side_<npc>_<n> is
# always the same quest as long as you keep the seed and don't reorder the lists below.
#
# Quests are built from the "types" below. Each target line is:
#   TARGET | min level | amount at that level | amount at level 99 | singular | plural
# TARGET can be one name, several joined with |, a wildcard like *_LOG, or a group like @IRON (see config.yml).

enabled: true
seed: 20261030
side-quests-per-npc: 10000

# How later quests get harder. Quest number n of a villager is at level (villager level + n / level-up-every),
# capped at 99. Over the first ramp-quests quests the amounts grow by up to 50% and the chance of a quest
# having two or three objectives moves from the first number to the second.
level-up-every: 100
ramp-quests: 500
two-objective-chance: [0.15, 0.5]
three-objective-chance: [0.0, 0.25]

# Chance that a side quest also gives one item from its reward tier.
item-chance: 0.6

# Chance a quest name gets a place added, e.g. "Zombie Hunt at Willow Creek".
place-chance: 0.6
places:
  - "at Willow Creek"
  - "on the North Road"
  - "near the Old Mill"
  - "by Stonebridge"
  - "in the Hollow Woods"
  - "at Aldmere's Gate"
  - "on Misty Hill"
  - "by the Wanderers' Camp"
  - "at Ravenrock"
  - "in the Sunken Vale"
  - "at Thornfield"
  - "on the Salt Coast"
  - "at Ember Pass"
  - "in the Whispering Marsh"
  - "at Greywatch"
  - "on the King's Road"
  - "at Copperhollow"
  - "by the Frozen Lake"
  - "at Brightwater"
  - "in the Red Canyon"
  - "at Oakheart"
  - "on Lantern Ridge"
  - "at the Broken Tower"
  - "in the Deep Mines"
  - "at Fallow Fields"
  - "by the Sea Wall"
  - "at Duskmere"
  - "in the Ashlands"
  - "at Highcairn"
  - "at the Last Inn"

daily:
  pool-size: 60
  level: 45
  objectives: 2

# Rewards by quest level:  max level | min money | max money | item choices
# Simple, fair items; only the hardest tiers give rare things.
reward-tiers:
  - "9  | 100 | 300  | BREAD 8, TORCH 16, IRON_INGOT 2, COOKED_BEEF 6, OAK_LOG 16, APPLE 6"
  - "19 | 150 | 450  | IRON_INGOT 4, GOLD_INGOT 3, ARROW 32, BAKED_POTATO 12, LANTERN 4, COAL 16"
  - "34 | 250 | 600  | IRON_INGOT 6, GOLD_INGOT 4, EMERALD 3, EXPERIENCE_BOTTLE 8, NAME_TAG 1, BOOK 6"
  - "49 | 350 | 800  | DIAMOND 1, EMERALD 5, EXPERIENCE_BOTTLE 12, GOLDEN_CARROT 16, SADDLE 1, IRON_BLOCK 1"
  - "69 | 500 | 1100 | DIAMOND 1, EXPERIENCE_BOTTLE 16, GOLDEN_APPLE 1, BLAZE_ROD 6, ENDER_PEARL 4, GOLD_BLOCK 1"
  - "89 | 700 | 1500 | DIAMOND 2, GOLDEN_APPLE 1, EXPERIENCE_BOTTLE 24, EMERALD_BLOCK 1, SHULKER_SHELL 1"
  - "99 | 900 | 2000 | DIAMOND 3, NETHERITE_SCRAP 1, GOLDEN_APPLE 2, EXPERIENCE_BOTTLE 32, DIAMOND_BLOCK 1"

# Timed quests: this share of side quests runs against the clock (marked with ⌛ and a
# countdown in the tracker). They pay the top of their tier. Out of time = the quest is dropped and
# can be taken again. Hand-written quests get a clock with  time-limit: 15m  in quests.yml.
timed-chance: 0.12
timed-minutes: 20

# Now and then a side quest also gives a potion effect: "EFFECT SECONDS [LEVEL]". Level 1 is the normal potion.
effect-chance: 0.06
effect-min-level: 10
effects:
  - "SPEED 3600 1"
  - "HASTE 1800 1"
  - "NIGHT_VISION 3600 1"
  - "LUCK 3600 1"
  - "FIRE_RESISTANCE 1200 1"
  - "WATER_BREATHING 1800 1"

thanks:
  - "Thank you, {player}. That helps more than you know."
  - "You're a lifesaver, {player}!"
  - "Ha! I knew I could count on you."
  - "That's exactly what I needed. Here, take this."
  - "The camp owes you one, {player}."
  - "Well done. Come back soon, I'm sure I'll need you again."
  - "Not bad at all, {player}. Not bad at all."

