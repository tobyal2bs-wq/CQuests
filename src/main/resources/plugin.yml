name: CQuests
version: '${version}'
main: com.cquests.CQuestsPlugin
api-version: '1.21'
folia-supported: true
description: Villager quest system with a linked story, chapters, a quest menu and a daily quest giver.
authors: [clarx]
softdepend: [WorldGuard, floodgate, Geyser-Spigot]

commands:
  quests:
    description: Open your quest menu.
    aliases: [quest, journal, q]
    usage: /quests [book|menu|settings|mode|directions|achievements|list|track|story|accept|abandon <quest>]
  cquests:
    description: CQuests admin commands.
    aliases: [cq]
    permission: cquests.admin
    usage: /cq help

permissions:
  quests.use:
    description: Use /quests (menu, journal, tracker). Give this to your default group.
    default: false
  cquests.admin:
    description: Manage CQuests NPCs, spawns and player data.
    default: op
  cquests.bypass:
    description: Build and fight inside the protected area around villagers. Nobody has it unless you give it.
    default: false
