name: CQuests
version: '${version}'
main: com.cquests.CQuestsPlugin
api-version: '1.21'
folia-supported: true
description: Villager quest system with a linked story, chapters, a quest menu and a daily quest giver.
authors: [clarx]
softdepend: [WorldGuard, Vault, PlaceholderAPI, floodgate, Geyser-Spigot, ViaVersion]

commands:
  quests:
    description: Open your quest menu.
    aliases: [quest, journal, q]
    usage: /quests or /quest mail
  cquests:
    description: CQuests admin commands.
    aliases: [cq]
    usage: /cq help

permissions:
  quests.use:
    description: Use /quests (menu, journal, tracker). Give this to your default group.
    default: false
  bosses.use:
    description: Control world bosses (/cq worldboss, /cq test worldboss, the boss panel and border stick). Operators have it; give it to anyone else who should. Same permission as CBosses.
    default: op
  cquests.admin:
    description: Manage CQuests NPCs, spawns and player data.
    default: op
    children:
      bosses.use: true
  cquests.bypass:
    description: Build and fight inside the protected area around villagers. Nobody has it unless you give it.
    default: false
