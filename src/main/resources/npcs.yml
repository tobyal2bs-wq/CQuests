# The villagers. Act 1 (14 story villagers + the daily one) stands at spawn. Act 2 lives out in the world and is personal:
# a personal villager is only visible to players who need it for a quest or have met it.
#
# profession: ARMORER BUTCHER CARTOGRAPHER CLERIC FARMER FISHERMAN FLETCHER LEATHERWORKER
#             LIBRARIAN MASON NITWIT NONE SHEPHERD TOOLSMITH WEAPONSMITH
# skin:       PLAINS DESERT JUNGLE SAVANNA SNOW SWAMP TAIGA
# level:      shown on the name tag; the robe badge goes stone > iron > gold > emerald > diamond every 20 levels
# intro:      said the first time a player clicks the villager
# idle:       one of these is said when the villager has nothing for you
# baby:       true for a baby villager
# player-skin: a player shaped NPC on 1.21.9+ with this skin: a Minecraft username, "default", or
#             "texture:<value>:<signature>" pasted from mineskin.org (that one never changes)

npcs:
  luma:
    name: "Luma"
    title: "Lantern Keeper"
    profession: LIBRARIAN
    skin: PLAINS
    level: 1
    act: 1
    chapter: 1
    intro: ["I keep a lantern burning for every traveler who hasn't found home.", "A little help keeps the whole camp bright."]
    idle: ["Small kindnesses have a habit of finding their way back."]
  copper_jack:
    name: "Copper Jack"
    title: "Camp Tinkerer"
    profession: TOOLSMITH
    skin: TAIGA
    level: 5
    act: 1
    chapter: 1
    intro: ["If it rattles, bring it to Jack. If it explodes, bring it to someone else.", "There's always another odd job on my bench."]
    idle: ["One day I'll build something that works on the first try."]
  map:
    name: "M.A.P."
    title: "Mostly Accurate Pathfinder"
    profession: CARTOGRAPHER
    skin: DESERT
    level: 20
    act: 2
    chapter: 2
    intro: ["Mostly Accurate Pathfinder, at your service.", "The mostly is doing a lot of work. Don't tell B.O.B."]
    idle: ["If we get lost together, that still counts as an expedition."]
  fern_gardener:
    name: "Fern Greenbough"
    title: "Keeper of Seeds"
    profession: FARMER
    skin: JUNGLE
    level: 25
    act: 2
    chapter: 2
    intro: ["I brought seeds from the old city. Every new shoot feels like a promise."]
    idle: ["Come back when you need a quiet job and a little fresh air."]
  nox:
    name: "Nox"
    title: "Night Watch"
    profession: WEAPONSMITH
    skin: TAIGA
    level: 45
    act: 2
    chapter: 3
    intro: ["The night isn't empty. Listen long enough and it tells you where help is needed."]
    idle: ["The next watch is easier with a friend."]
  ember:
    name: "Ember"
    title: "The Wandering Smith"
    profession: ARMORER
    skin: SAVANNA
    level: 65
    act: 2
    chapter: 4
    intro: ["A city can fall. A good hammer can still build another."]
    idle: ["Every finished job brings us closer to home."]
  astra:
    name: "Astra"
    title: "Star Reader"
    profession: CLERIC
    skin: SNOW
    level: 80
    act: 2
    chapter: 5
    intro: ["Even above the ruins, the stars remember our names."]
    idle: ["Our story has more pages than we thought."]
  tilly_weaver:
    name: "Tilly Weaver"
    title: "Keeper of Tomorrow"
    profession: SHEPHERD
    skin: SWAMP
    level: 85
    act: 2
    chapter: 5
    intro: ["Someone has to plan the first ordinary day after all this is over.", "We'll start with blankets, bread, and a place for everyone."]
    idle: ["There's good work left to do, even after the grand adventures."]
  marigold:
    name: "Granny Marigold"
    title: "Daily Jobs"
    profession: CLERIC
    skin: PLAINS
    level: 50
    act: 1
    daily: true
    intro:
      - "Hello, dear. I'm Marigold."
      - "Every day I have one little job. Every day I pay ten thousand. Fair's fair."
    idle:
      - "Back again? Wonderful."
      - "Same time tomorrow, dear."
  stephan:
    name: "Stephan"
    title: "Keeper of the Road"
    profession: LIBRARIAN
    skin: PLAINS
    level: 0
    act: 1
    intro:
      - "Ah, a new face! Welcome, welcome."
      - "We are the Wanderers. What's left of the old city of Aldmere, anyway."
      - "We fled when the ground under the city began to groan. Something sleeps down there, {player}."
    idle:
      - "The road was long. I'm glad it ended here."
  jerry:
    name: "Jerry"
    title: "the Farmer"
    profession: FARMER
    skin: PLAINS
    level: 1
    act: 1
    intro:
      - "Name's Jerry. I keep this camp fed."
      - "Or I try to, with the wolves stealing my sheep every night."
    idle:
      - "If it grows, I've probably planted it."
  steve:
    name: "Steve"
    title: "the Planter"
    profession: FARMER
    skin: PLAINS
    level: 2
    act: 1
    intro:
      - "Hey there. I'm Steve, Jerry's cousin."
      - "He hunts, I grow. Somebody has to."
    idle:
      - "Never trust a farmer with clean boots."
  martha:
    name: "Martha"
    title: "the Watchful"
    profession: FARMER
    skin: PLAINS
    level: 3
    act: 1
    intro:
      - "You're the new one. I'm Martha."
      - "I watch the fields at night. Lately the dead walk through them."
    idle:
      - "The nights are getting longer. Have you noticed?"
  finn:
    name: "Finn"
    title: "the Angler"
    profession: FISHERMAN
    skin: PLAINS
    level: 4
    act: 1
    intro:
      - "Finn's the name. Fish is the game."
      - "The river here is full of them, if you're patient."
    idle:
      - "The fish are talking. They say you're new."
  greta:
    name: "Greta"
    title: "the Shepherd"
    profession: SHEPHERD
    skin: PLAINS
    level: 5
    act: 1
    intro:
      - "Greta. I keep the flock."
      - "Winter in Aldmere taught us one thing: never run out of wool."
    idle:
      - "Count sheep if you can't sleep. I count them all day."
  oliver:
    name: "Oliver"
    title: "the Fletcher"
    profession: FLETCHER
    skin: PLAINS
    level: 6
    act: 1
    intro:
      - "I'm Oliver. I make the arrows that keep this camp safe."
      - "Can't make arrows from wishes though."
    idle:
      - "Straight shafts, true flight. That's the Fletcher's code."
  rosie:
    name: "Rosie"
    title: "the Cook"
    profession: BUTCHER
    skin: PLAINS
    level: 7
    act: 1
    intro:
      - "Rosie! I run the cookpot."
      - "Everyone eats, nobody brings food. Funny how that works."
    idle:
      - "Wash your hands before you touch my pot."
  harold:
    name: "Harold"
    title: "the Mason"
    profession: MASON
    skin: PLAINS
    level: 8
    act: 1
    intro:
      - "Harold. I build walls."
      - "A camp without walls is just a picnic waiting for a raid."
    idle:
      - "Stone remembers. That's why I like it."
  nina:
    name: "Nina"
    title: "the Healer"
    profession: CLERIC
    skin: PLAINS
    level: 9
    act: 1
    intro:
      - "I'm Nina. I patch people up."
      - "Lately it's arrow wounds. Skeletons, out past the fence."
    idle:
      - "Drink water. Sleep. Avoid arrows. Doctor's orders."
  walter:
    name: "Walter"
    title: "the Tanner"
    profession: LEATHERWORKER
    skin: PLAINS
    level: 10
    act: 1
    intro:
      - "Walter. Leatherworker."
      - "Our boots fell apart on the road from Aldmere. Half the camp walks barefoot."
    idle:
      - "Smells like cow in here. You get used to it."
  ivy:
    name: "Ivy"
    title: "the Gardener"
    profession: FARMER
    skin: PLAINS
    level: 11
    act: 1
    intro:
      - "Hello! I'm Ivy."
      - "Steve grows wheat, I grow everything else."
    idle:
      - "Talk to your plants. Mine talk back. Mostly."
  gus:
    name: "Gus"
    title: "the Old Salt"
    profession: FISHERMAN
    skin: PLAINS
    level: 12
    act: 1
    intro:
      - "Gus. Been fishing since before you were born."
      - "Back in Aldmere I caught a salmon as long as a door."
    idle:
      - "The big one always gets away. That's the rule."
  clara:
    name: "Clara"
    title: "the Scribe"
    profession: LIBRARIAN
    skin: PLAINS
    level: 13
    act: 1
    intro:
      - "I'm Clara. I write things down."
      - "Someone has to remember what happened to Aldmere."
    idle:
      - "I've written about you already. Don't worry, it's flattering."
  tom:
    name: "Tom"
    title: "the Armorer"
    profession: ARMORER
    skin: PLAINS
    level: 14
    act: 2
    personal: true
    intro:
      - "Tom. I make armour."
      - "Iron's what I need. Smelted, not raw."
    idle:
      - "A good helmet has saved more lives than any sword."
  penny:
    name: "Penny"
    title: "the Mapmaker"
    profession: CARTOGRAPHER
    skin: PLAINS
    level: 15
    act: 2
    personal: true
    intro:
      - "Penny. I make maps."
      - "We need to know where we are before we can know where we're going."
    idle:
      - "North is that way. Probably."
  arthur:
    name: "Arthur"
    title: "the Swordsmith"
    profession: WEAPONSMITH
    skin: PLAINS
    level: 16
    act: 2
    personal: true
    intro:
      - "Arthur. I teach the young ones to fight."
      - "You look like you could use a lesson."
    idle:
      - "Keep your guard up. Always."
  mabel:
    name: "Mabel"
    title: "the Herder"
    profession: SHEPHERD
    skin: PLAINS
    level: 17
    act: 2
    personal: true
    intro:
      - "Mabel. Greta's sister."
      - "Greta usually shears them. Today, so do you."
    idle:
      - "One sheep, two sheep, three sheep... where was I?"
  dave:
    name: "Dave"
    title: "the Night Guard"
    profession: BUTCHER
    skin: PLAINS
    level: 18
    act: 2
    personal: true
    intro:
      - "Dave. I take the night shift."
      - "The creepers are the worst. You never hear them coming."
    idle:
      - "Hssss... Sorry. Habit."
  lucy:
    name: "Lucy"
    title: "the Weaver"
    profession: CLERIC
    skin: PLAINS
    level: 19
    act: 2
    personal: true
    intro:
      - "I'm Lucy. I weave bandages for Nina."
      - "Spider silk makes the strongest thread."
    idle:
      - "Every thread holds something together."
  benny:
    name: "Benny"
    title: "the Hopeless"
    profession: NITWIT
    skin: PLAINS
    level: 20
    act: 2
    baby: true
    personal: true
    intro:
      - "Hi! I'm Benny! I lost all the chickens!"
      - "Well, not lost. They ran. Fast."
    idle:
      - "I'm not clumsy. The ground just hates me."
  hazel:
    name: "Hazel"
    title: "the Sweet Tooth"
    profession: FARMER
    skin: PLAINS
    level: 21
    act: 2
    personal: true
    intro:
      - "Hazel. I make the sugar."
      - "Nobody admits it, but the whole camp runs on cake."
    idle:
      - "Life's short. Eat the cake."
  frank:
    name: "Frank"
    title: "the Brickmaker"
    profession: MASON
    skin: PLAINS
    level: 22
    act: 2
    personal: true
    intro:
      - "Frank. Harold's apprentice."
      - "He does stone. I do bricks. Bricks are better."
    idle:
      - "Brick by brick. That's how you build anything."
  edith:
    name: "Edith"
    title: "the Archivist"
    profession: LIBRARIAN
    skin: PLAINS
    level: 23
    act: 2
    personal: true
    intro:
      - "Edith. I kept the archives of Aldmere."
      - "I saved only a few books when we fled. The dead have the rest."
    idle:
      - "Knowledge is the only treasure that grows when shared."
  bob:
    name: "B.O.B"
    title: "the Discord Bot"
    profession: NITWIT
    skin: PLAINS
    level: 24
    act: 2
    personal: true
    intro:
      - "BEEP BOOP. Hello {player}. I am B.O.B, the official {server} Discord bot."
      - "Somebody typed !spawn in the wrong channel and now I have legs."
      - "I have read four million chat messages. I have never touched a single block."
    idle:
      - "Error 404: quest not found. Try again later."
      - "Have you tried turning your sword off and on again?"
      - "I muted three people today. New personal record."
      - "Do not tell the admins I can walk."
  sam:
    name: "Sam"
    title: "the Delver"
    profession: TOOLSMITH
    skin: PLAINS
    level: 25
    act: 2
    personal: true
    intro:
      - "Sam. I keep B.O.B oiled."
      - "Ever since the bot grew legs he wants iron tools. Do not ask me why a bot needs a pickaxe."
    idle:
      - "The deeper you go, the better it gets. Usually."
  molly:
    name: "Molly"
    title: "the Inkmaker"
    profession: FISHERMAN
    skin: PLAINS
    level: 26
    act: 2
    personal: true
    intro:
      - "Molly. I make ink for Clara's books."
      - "Squid make the best ink, but they're slippery."
    idle:
      - "Ink stains never come out. Trust me."
  george:
    name: "George"
    title: "the Archer"
    profession: FLETCHER
    skin: PLAINS
    level: 27
    act: 2
    personal: true
    intro:
      - "George. I train the archers."
      - "Oliver makes arrows, I shoot them. We go through a lot."
    idle:
      - "Breathe in. Aim. Breathe out. Release."
  daisy:
    name: "Daisy"
    title: "the Pumpkin Queen"
    profession: FARMER
    skin: PLAINS
    level: 28
    act: 2
    baby: true
    personal: true
    intro:
      - "Daisy! I grow the pumpkins."
      - "Biggest pumpkins this side of Aldmere."
    idle:
      - "Carve a face in one. It keeps the bad things away. Maybe."
  ralph:
    name: "Ralph"
    title: "the Gatekeeper"
    profession: BUTCHER
    skin: PLAINS
    level: 29
    act: 2
    personal: true
    intro:
      - "Ralph. I keep the gate."
      - "Every night more of them come. More than in Aldmere, even."
    idle:
      - "Something is calling them. I'd swear it."
  agnes:
    name: "Agnes"
    title: "the Herbalist"
    profession: CLERIC
    skin: SWAMP
    level: 30
    act: 2
    personal: true
    intro:
      - "Agnes. I brew remedies."
      - "Some say rotten flesh is useless. Some are wrong."
    idle:
      - "Smell that? That's medicine."
  leo:
    name: "Leo"
    title: "the Chainmaker"
    profession: ARMORER
    skin: PLAINS
    level: 31
    act: 2
    personal: true
    intro:
      - "Leo. Tom's brother."
      - "He makes plate, I make chain. We need iron for both."
    idle:
      - "Link by link. Like friendship."
  winnie:
    name: "Winnie"
    title: "the Dyer"
    profession: SHEPHERD
    skin: PLAINS
    level: 32
    act: 2
    personal: true
    intro:
      - "Winnie. I dye the wool."
      - "Aldmere was colourful once. I want that back."
    idle:
      - "Red for courage, blue for home."
  cecil:
    name: "Cecil"
    title: "the Scout"
    profession: CARTOGRAPHER
    skin: PLAINS
    level: 33
    act: 2
    player-skin: "default"
    personal: true
    intro:
      - "Cecil. I scout the roads."
      - "Pillagers have been watching the camp. I've seen their banners."
    idle:
      - "Keep low, move quiet, see everything."
  betty:
    name: "Betty"
    title: "the Beekeeper"
    profession: FARMER
    skin: PLAINS
    level: 34
    act: 2
    personal: true
    intro:
      - "Betty. I keep bees."
      - "Honey heals, sweetens and makes everyone smile."
    idle:
      - "Bzzz. Sorry, they're rubbing off on me."
  otto:
    name: "Otto"
    title: "the Deep Mason"
    profession: MASON
    skin: PLAINS
    level: 35
    act: 2
    personal: true
    intro:
      - "Otto. I cut deepslate."
      - "It's the only stone strong enough for what's coming."
    idle:
      - "The deep rock hums at night. Have you heard it?"
  june:
    name: "June"
    title: "the Enchantress"
    profession: LIBRARIAN
    skin: PLAINS
    level: 36
    act: 2
    personal: true
    intro:
      - "June. I study enchanting."
      - "Lapis is the key. Without it, no magic."
    idle:
      - "Magic is just knowledge nobody explained yet."
  hank:
    name: "Hank"
    title: "the Goldsmith"
    profession: WEAPONSMITH
    skin: DESERT
    level: 37
    act: 2
    personal: true
    intro:
      - "Hank. I work gold."
      - "Gold is soft, but piglins love it. That makes it useful."
    idle:
      - "All that glitters is probably gold. I checked."
  fern:
    name: "Fern"
    title: "the Melon Grower"
    profession: FARMER
    skin: JUNGLE
    level: 38
    act: 2
    personal: true
    intro:
      - "Fern. Melons are my thing."
      - "Hot summers, cool melons."
    idle:
      - "Spit the seeds at Benny. Everyone does."
  ned:
    name: "Ned"
    title: "the Treasure Hunter"
    profession: FISHERMAN
    skin: PLAINS
    level: 39
    act: 2
    player-skin: "default"
    personal: true
    intro:
      - "Ned. I fish for more than fish."
      - "Sometimes the water gives up treasure. Old things from Aldmere."
    idle:
      - "Patience. The lake gives to those who wait."
  iris:
    name: "Iris"
    title: "the Witchfinder"
    profession: CLERIC
    skin: SWAMP
    level: 40
    act: 2
    personal: true
    intro:
      - "Iris. I track witches."
      - "They brew poisons in the swamp. Some of them came from Aldmere's ruins."
    idle:
      - "If you smell something sweet in the swamp, run."
  percy:
    name: "Percy"
    title: "the Tinkerer"
    profession: TOOLSMITH
    skin: PLAINS
    level: 41
    act: 2
    personal: true
    intro:
      - "Percy! Inventor! Genius! Mostly genius."
      - "I need redstone for my newest machine."
    idle:
      - "Don't touch that lever. Or do. I'm curious."
  doris:
    name: "Doris"
    title: "the Stablemaster"
    profession: LEATHERWORKER
    skin: SAVANNA
    level: 42
    act: 2
    personal: true
    intro:
      - "Doris. I run the stables."
      - "Empty stables, I should say. We left our horses in Aldmere."
    idle:
      - "A horse knows your heart before you do."
  albert:
    name: "Albert"
    title: "the Old Knight"
    profession: ARMORER
    skin: PLAINS
    level: 43
    act: 2
    personal: true
    intro:
      - "Albert. I was a knight of Aldmere once."
      - "Now I'm an old man with no armour."
    idle:
      - "I saw the King once. Before. He was... different."
  maggie:
    name: "Maggie"
    title: "the Dog Lover"
    profession: SHEPHERD
    skin: TAIGA
    level: 44
    act: 2
    personal: true
    intro:
      - "Maggie. I love dogs."
      - "A good dog hears danger before any guard."
    idle:
      - "Every camp needs a dog. Or six."
  vince:
    name: "Vince"
    title: "the Enchanter"
    profession: WEAPONSMITH
    skin: PLAINS
    level: 45
    act: 2
    personal: true
    intro:
      - "Vince. June's student."
      - "She studies magic. I use it."
    idle:
      - "Purple sparkles mean it worked."
  ellie:
    name: "Ellie"
    title: "the Coastwatcher"
    profession: CARTOGRAPHER
    skin: PLAINS
    level: 46
    act: 2
    personal: true
    intro:
      - "Ellie. I watch the coast."
      - "The drowned are walking out of the sea. More every night."
    idle:
      - "The sea is restless. Like the ground under Aldmere."
  rufus:
    name: "Rufus"
    title: "the Demolitionist"
    profession: BUTCHER
    skin: PLAINS
    level: 47
    act: 2
    personal: true
    intro:
      - "Rufus. I collect gunpowder."
      - "Creepers have plenty. They just don't like sharing."
    idle:
      - "Things that go boom are my favourite things."
  opal:
    name: "Opal"
    title: "the Jeweller"
    profession: LIBRARIAN
    skin: PLAINS
    level: 48
    act: 2
    personal: true
    intro:
      - "Opal. I study gems."
      - "Diamonds are said to hold the light of the old world."
    idle:
      - "Every gem has a story. Most of them are about pressure."
  marcus:
    name: "Marcus"
    title: "Elder of the Wanderers"
    profession: NONE
    skin: PLAINS
    level: 49
    act: 2
    personal: true
    intro:
      - "I am Marcus, elder of the Wanderers."
      - "You have helped everyone in this camp. Now I must ask more of you."
      - "The Hollow King stirs beneath Aldmere. We must know what we face."
    idle:
      - "Rest while you can, {player}. The road ahead is hard."
  wren:
    name: "Wren"
    title: "the Wild Scout"
    profession: CARTOGRAPHER
    skin: TAIGA
    level: 50
    act: 2
    personal: true
    intro:
      - "Marcus sent you? Then it's begun."
      - "I'm Wren. I've walked every road between here and Aldmere."
    idle:
      - "Never camp in the open. Never."
  silas:
    name: "Silas"
    title: "the Gatebuilder"
    profession: TOOLSMITH
    skin: TAIGA
    level: 51
    act: 2
    personal: true
    intro:
      - "Silas. I build gates."
      - "Not wooden gates. Gates to other places."
    idle:
      - "Water on lava. That's the trick."
  cora:
    name: "Cora"
    title: "the Firewalker"
    profession: CLERIC
    skin: SWAMP
    level: 52
    act: 2
    personal: true
    intro:
      - "Cora. I've been to the Nether and back."
      - "Most people don't come back. I'm stubborn."
    idle:
      - "Bring fire resistance. Always."
  jasper:
    name: "Jasper"
    title: "the Quartz Cutter"
    profession: MASON
    skin: PLAINS
    level: 53
    act: 2
    personal: true
    intro:
      - "Jasper. I cut quartz."
      - "Nether quartz. White as bone, and twice as hard."
    idle:
      - "Quartz rings when you strike it. Listen."
  nell:
    name: "Nell"
    title: "the Wart Grower"
    profession: FARMER
    skin: SWAMP
    level: 54
    act: 2
    personal: true
    intro:
      - "Nell. I grow nether wart."
      - "Nobody else wants to. That's why I do."
    idle:
      - "It only grows on soul sand. Spooky, isn't it?"
  felix:
    name: "Felix"
    title: "the Ghast Hunter"
    profession: FLETCHER
    skin: DESERT
    level: 55
    act: 2
    personal: true
    intro:
      - "Felix. I hunt ghasts."
      - "Their tears heal. Their screams don't."
    idle:
      - "Ghasts cry because they're sad. Or angry. Hard to say."
  bea:
    name: "Bea"
    title: "the Flame Scholar"
    profession: LIBRARIAN
    skin: DESERT
    level: 56
    act: 2
    personal: true
    intro:
      - "Bea. I study blazes."
      - "The King's guard were blazes, the old texts say."
    idle:
      - "Fire is just angry light."
  roland:
    name: "Roland"
