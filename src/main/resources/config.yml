# ===================================================================
#  CQuests config
# ===================================================================
#  How the plugin behaves. Text players see is in messages.yml,
#  villagers in npcs.yml, the story in quests.yml and side quests in
#  generator.yml. After editing, run /cq reload.
# ===================================================================

# Shown in quest text as {server}.
server-name: "Dawn SMP"

# All text players see (prefix, villager name tags, chat lines, messages) lives in messages.yml.

# ----------------------------------------------------------- ECONOMY
# Console command that pays money rewards. %player% and %amount% are filled in.
money-command: "economy give %player% %amount%"
# How CQuests reads balances and takes money (chapter costs, farm hoes, merchants).
# Leave all three empty to use Vault. If your economy has no Vault support, set your own:
#   balance-placeholder: any PlaceholderAPI placeholder that shows the balance, e.g. "%vault_eco_balance%".
#                        "$5,000,000.00", "5.2M" and "12k" are all understood.
#   take-command / give-command: console commands; %player% and %amount% are filled in.
#                        give-command is used for refunds; empty uses money-command.
economy:
  balance-placeholder: ""
  take-command: ""
  give-command: ""

# ----------------------------------------------------------- TALKING TO VILLAGERS
dialogue:
  # Private sentence-by-sentence text beneath the NPC name. Click again for native dialog choices.
  overhead-speech: true
  # One character every two ticks, followed by four seconds to read each sentence.
  character-ticks: 2
  reading-pause-ticks: 80
  # Fallback NPC conversation preference. /quests opens the simple quest home.
  # Explicit /quests book, /quests menu and /quests chat remain available.
  default-mode: book
  # Pause between lines a villager says (20 ticks = 1 second).
  line-delay-ticks: 35
  # How long a quest offer waits for the second click or [Accept].
  accept-timeout-seconds: 60

# ----------------------------------------------------------- QUEST RULES
quests:
  # Side quests a player can hold at once (story and daily quests don't count).
  max-active-side: 3
  # Given to every player on first join. "" turns it off.
  welcome-quest: welcome
  # Breaking or harvesting blocks you placed yourself does not count.
  ignore-player-placed-blocks: true
  # Mobs from spawners and spawn eggs do not count for KILL objectives (stops mob farm skipping).
  count-spawner-mobs: false
  # Side quests needed for the previous villager before a story quest opens, when the quest
  # in quests.yml has no side-required of its own. Quests added later (chapter 6 and on) use this.
  side-quests-per-chapter: 0
  # Also enables per-quest side-required quotas. Off by default.
  require-side-quests: false

# ----------------------------------------------------------- REWARDS
rewards:
  # Never given out, even if a quest lists them.
  blocked-items: [ELYTRA, DRAGON_EGG, ENCHANTED_GOLDEN_APPLE, TOTEM_OF_UNDYING, BEACON, NETHER_STAR]
  # Netherite items are only given by quests of at least this level.
  netherite-min-level: 85

# ----------------------------------------------------------- SAVING AND BACKUPS
# Progress is saved the moment a quest is finished, plus every minute and on shutdown.
# Each save keeps the previous version as players/<uuid>.yml.bak, which is used automatically
# if a file is ever damaged. On top of that, zip backups go into plugins/CQuests/backups/.
# Restore with /cq restore <backup|latest> <player|all>.
backups:
  enabled: true
  every-hours: 6
  # How many backup zips to keep (28 at every 6 hours = one week). A backup is also made on shutdown.
  keep: 28

# ----------------------------------------------------------- MENU AND TRACKER
tracker:
  # The boss bar at the top of the screen that follows one quest. Players can still turn it off.
  enabled: true
  # The feature is available, but each player must opt in.
  default-on: false

directions:
  # An arrow and the distance to the next villager above the hotbar. /quests directions toggles it,
  # /quests where says who and where in chat. Every player's compass also points to the next villager.
  default-on: true

# ----------------------------------------------------------- ANIMATIONS
celebrations:
  # Animation, fireworks and music when a quest marked big: true or a chapter is finished.
  big-quests: true

finale:
  # After the last story quest: a camera tour over the places of the player's story, their stats,
  # "The End", fireworks, the "Finished the Journey" achievement and a "Your Story" book.
  # Achievements (one per chapter plus the ending) need no datapack; their names are in messages.yml.
  enabled: true
  scene-seconds: 4
  max-scenes: 12

# ----------------------------------------------------------- DAILY QUEST
daily:
  # NPC id from npcs.yml that gives the daily quest.
  npc: marigold
  cooldown-hours: 24
  money: 10000
  # Daily streaks: finishing a daily on the day after the last one adds a day to the streak.
  # Every streak day adds streak-bonus-percent of the daily's money, up to streak-max-days.
  # Missing a whole day starts again at 1. Shown with %cquests_daily_streak%.
  # Daily money is rolled for each player and day between these percentages of the quest's money,
  # so some days pay little and some pay a lot.
  money-min-percent: 25
  money-max-percent: 300
  streaks: true
  streak-max-days: 7
  streak-bonus-percent: 10

# ----------------------------------------------------------- VILLAGER SPAWNING
spawning:
  # Five camp residents, plus the daily villager. Other unplaced NPCs use the surrounding world.
  # Existing saved positions are preserved; /cq camp explicitly arranges this layout.
  camp-npcs: [stephan, jerry, rosie, copper_jack, luma, bob]
  # NPCs without a spot in spawns.yml are placed around the world spawn on startup.
  # Move them with /cq npc place <id> or /cq scatter.
  auto-place-unplaced: true
  # World for auto placement. "" means the main world.
  auto-place-world: ""
  # Rings around spawn in blocks, [min, max]: act 1 (the 15 spawn villagers) and act 2.
  act1-ring: [5, 60]
  act2-ring: [70, 300]
  # An NPC only exists while a player is within this many blocks. With nobody near it is removed.
  player-range: 100
  # How often NPCs are spawned, removed and moved.
  check-seconds: 3
  # NPCs placed with /cq scatter move to a new random spot in their area this often (0 = never).
  roam-minutes: 0
  # A player stops seeing a villager once they finished everything it has for them.
  hide-finished-villagers: false
  # NPCs turn to face whoever clicks them.
  look-at-player: true

# ----------------------------------------------------------- PROTECTION
shield:
  # Blocks around each NPC where nobody can build, break, use buckets, blow things up or PvP.
  # Only players given cquests.bypass ignore it.
  radius: 6
  block-building: true
  block-pvp: true

# ----------------------------------------------------------- JOURNAL BOOK
book:
  title: "Quest Journal"
  author: "The Wanderers"
  # Lines per "All Quests" page. 8 or less fits on Java and Bedrock screens.
  quests-per-index-page: 8
  progress-bar-length: 18

# ----------------------------------------------------------- TARGET GROUPS
# Groups usable as a target with @NAME, for example "MINE @LOGS 32 logs".
groups:
  LOGS: ["*_LOG", "*_STEM"]
  COAL: [COAL_ORE, DEEPSLATE_COAL_ORE]
  IRON: [IRON_ORE, DEEPSLATE_IRON_ORE]
  COPPER: [COPPER_ORE, DEEPSLATE_COPPER_ORE]
  GOLD: [GOLD_ORE, DEEPSLATE_GOLD_ORE, NETHER_GOLD_ORE]
  REDSTONE: [REDSTONE_ORE, DEEPSLATE_REDSTONE_ORE]
  LAPIS: [LAPIS_ORE, DEEPSLATE_LAPIS_ORE]
  DIAMOND: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE]
  EMERALD: [EMERALD_ORE, DEEPSLATE_EMERALD_ORE]
  WOOL: ["*_WOOL"]
  FISH: [COD, SALMON, PUFFERFISH, TROPICAL_FISH]
  RAW_MEAT: [BEEF, PORKCHOP, CHICKEN, MUTTON, RABBIT]
  COOKED_MEAT: [COOKED_BEEF, COOKED_PORKCHOP, COOKED_CHICKEN, COOKED_MUTTON, COOKED_RABBIT]
  FLOWERS: [DANDELION, POPPY, BLUE_ORCHID, ALLIUM, AZURE_BLUET, RED_TULIP, ORANGE_TULIP, WHITE_TULIP, PINK_TULIP, OXEYE_DAISY, CORNFLOWER, LILY_OF_THE_VALLEY]
  SAPLINGS: ["*_SAPLING", MANGROVE_PROPAGULE]

# ----------------------------------------------------------- JOINING
welcome:
  # Chat on join (the how-to-play text from messages.yml, "New quest", unread mail). Off: players
  # join to a clean chat; the arrow above the hotbar and their compass already point to the first villager.
  chat-message: false

# ----------------------------------------------------------- CHAPTERS
chapters:
  # Chapters that are switched off. Their villagers do not spawn and their story quests do not
  # exist, so for players the story ends with the last chapter that is on.
  # Chapters 6 to 10 (Iron Tusk, Tides of the Drowned, Ember Court, Bone Choir, Listener Below)
  # start off. Turn one on in game with /cq chapter 6 on, or edit this list and /cq reload.
  # Chapter 1 can never be switched off.
  locked: [6, 7, 8, 9, 10]
  # Starting a new chapter (taking its first story quest) costs money (see economy: at the top).
  # Without Vault or economy.take-command chapters stay free. Set costs-enabled: false to turn it off.
  costs-enabled: true
  # Extra rewards for finishing a chapter. items: "MATERIAL amount"; commands run from the console
  # with %player% filled in, e.g. "give %player% diamond 5" or a crate key command.
  rewards:
    5:
      items: ["ELYTRA 1"]
      commands: []
  cost:
    2: 5000000
    3: 10000000
    4: 20000000
    5: 35000000
    6: 50000000
    7: 75000000
    8: 100000000
    9: 150000000
    10: 250000000

# ----------------------------------------------------------- DISCORD
discord:
  # A Discord webhook link (Server Settings > Integrations > Webhooks > Copy Webhook URL).
  # Empty turns Discord off. Posts are sent in the background, never more than one every 2 seconds,
  # and never ping @everyone, roles or users.
  webhook-url: ""
  username: "CQuests"
  # Picture for the webhook and the footer of every post (any https image link).
  avatar-url: ""
  # The player's face next to their name and their skin on the right of every post.
  # <uuid> and <player> are filled in. "" turns either off. These pictures come from mc-heads.net.
  player-head-url: "https://mc-heads.net/avatar/<uuid>/64"
  player-body-url: "https://mc-heads.net/body/<uuid>/128"
  # Optional wide picture under every post, e.g. your server banner.
  banner-url: ""
  events:
    chapter-complete: true
    journey-finished: true
    boss-defeated: true
    # Posted at 7, 30 and 100 days and every full year.
    daily-streak: true
  # Optional custom text for the line under the title. Placeholders: <player>, <chapter>, <name>, <boss>, <days>, <server>.
  messages:
    chapter-complete: "📖 **<player>** finished Chapter <chapter>: <name>"
    journey-finished: "🏆 **<player>** finished the whole journey on <server>!"
    boss-defeated: "⚔️ **<player>** defeated **<boss>**!"
    daily-streak: "🔥 **<player>** is on a <days>-day daily quest streak!"

# Uppercase NPC display names; quest IDs and stored names are unchanged.
npc:
  uppercase-names: true

# NPC story choices are configured in memories.yml. These toggles control temporary quest actors.
# Boss fights are set up in bosses.yml: each boss is private to the player who summoned it,
# invisible to everyone else, only hurts its owner and never breaks or burns blocks.
adventures:
  enabled: true
  # Pip can join a player in this many boss fights (bow or sword, chosen in the boss menu).
  pip-boss-help: 3
  companions: true
  wither: true

progression:
  daily-min-level: 10
  chapter-levels:
    1: 0
    2: 100
    3: 200
    4: 300
    5: 400
    6: 420
    7: 440
    8: 460
    9: 480
    10: 500
