# CQuests - villager quest system
# Text uses MiniMessage: https://docs.advntr.dev/minimessage/format.html

# Used in quest text as {server}, e.g. the "Welcome to {server}" quest.
server-name: ColorGens

# Console command used to pay money rewards. %player% and %amount% are filled in.
money-command: "eco give %player% %amount%"

npc:
  # Name tag over the villager. <name>, <level> and <title> are filled in.
  name-format: "<gold><name></gold> <dark_gray>[<gray>Lv <level></gray>]</dark_gray>"
  # How a villager's chat lines look.
  chat-format: "<gold><name></gold><dark_gray>:</dark_gray> <white><text>"
  # How a villager is written inside quest text and the journal ({npc:id}).
  mention-format: "<blue>Villager <name></blue>"

dialogue:
  # Pause between lines a villager says (20 ticks = 1 second).
  line-delay-ticks: 35
  # How long a quest offer waits for the second click / [Accept].
  accept-timeout-seconds: 60

quests:
  # Side quests a player can hold at once (story and daily quests don't count).
  max-active-side: 3
  # Given to every player on first join. Set to "" to disable.
  welcome-quest: welcome
  # Breaking a block you placed yourself does not count for MINE objectives.
  ignore-player-placed-blocks: true
  # Side quests a player must finish for a story villager before the next villager's story quest opens.
  # 100 chapters x 10 makes the story roughly 1,100 quests long. Set to 0 to make the story a straight line.
  side-quests-per-chapter: 10

celebrations:
  # Title, fireworks and sounds when a quest marked "big: true" in quests.yml is finished.
  big-quests: true

finale:
  # When the last story quest is done: a camera tour over the places of the player's story,
  # their stats, "The End", fireworks and the custom advancement below.
  enabled: true
  scene-seconds: 4
  max-scenes: 12
  advancement:
    title: "Finished the Journey"
    description: "Free the Hollow King and bring the Wanderers home"

daily:
  # NPC id from npcs.yml that hands out the daily quest.
  npc: marigold
  cooldown-hours: 24
  money: 10000

spawning:
  # NPCs without a spawn point in spawns.yml get one around the world spawn on startup.
  # Move them later with /cq npc place <id> or /cq scatter.
  auto-place-unplaced: true
  # World for auto placement. Empty = the main world.
  auto-place-world: ""
  # Act 1 (the 15 spawn villagers) and act 2 (the wilds) rings around spawn, in blocks: [min, max].
  act1-ring: [5, 22]
  act2-ring: [30, 90]
  # A villager only exists while a player is within this many blocks of it. With nobody around
  # it is removed, so 100 villagers cost nothing on an empty map.
  player-range: 100
  # How often villagers are spawned/removed based on player range.
  check-seconds: 3
  # Villagers turn to face whoever clicks them.
  look-at-player: true

shield:
  # Blocks around each villager's spot where nobody can build, break, use buckets, blow things up or PvP.
  # Stops players walling villagers in or camping others at them. cquests.bypass ignores it.
  radius: 6
  block-building: true
  block-pvp: true

book:
  title: "Quest Journal"
  author: "The Wanderers"
  # Lines per "All Quests" page. Keep it at 8 or less so pages fit on Java and Bedrock screens.
  quests-per-index-page: 8
  progress-bar-length: 18

# Named groups usable as a target with @NAME, e.g. "MINE @LOGS 32 logs".
groups:
  LOGS: ["*_LOG", "*_STEM"]
  COAL: [COAL_ORE, DEEPSLATE_COAL_ORE]
  IRON: [IRON_ORE, DEEPSLATE_IRON_ORE]
  COPPER: [COPPER_ORE, DEEPSLATE_COPPER_ORE]
  GOLD: [GOLD_ORE, DEEPSLATE_GOLD_ORE, NETHER_GOLD_ORE]
  REDSTONE: [REDSTONE_ORE, DEEPSLATE_REDSTONE_ORE]
  LAPIS: [LAPIS_ORE, DEEPSLATE_LAPIS_ORE]
  DIAMOND: [DIAMOND_ORE, DEEPSLATE_DIAMOND_ORE]
  EMERALD: [EMERALD_ORE, DEEPSLATE_EMERALD_ORE]
  WOOL: ["*_WOOL"]
  FISH: [COD, SALMON, PUFFERFISH, TROPICAL_FISH]
  RAW_MEAT: [BEEF, PORKCHOP, CHICKEN, MUTTON, RABBIT]
  COOKED_MEAT: [COOKED_BEEF, COOKED_PORKCHOP, COOKED_CHICKEN, COOKED_MUTTON, COOKED_RABBIT]
  FLOWERS: [DANDELION, POPPY, BLUE_ORCHID, ALLIUM, AZURE_BLUET, RED_TULIP, ORANGE_TULIP, WHITE_TULIP, PINK_TULIP, OXEYE_DAISY, CORNFLOWER, LILY_OF_THE_VALLEY]
  SAPLINGS: ["*_SAPLING", MANGROVE_PROPAGULE]

messages:
  quest-accepted: "<green>New quest: <white><bold><quest></bold></white>. Type <yellow>/quests</yellow> to read your journal."
  quest-ready: "<green>✔ <white><bold><quest></bold></white> is done! Return to <npc>."
  quest-complete: "<gold>★ Quest complete: <white><bold><quest></bold></white>"
  delivered: "<gray>You hand over <white><amount> <item></white>. <yellow>(<have>/<need>)"
  accept-prompt: "<yellow>Click the villager again to accept."
  npc-locked: "I'm not ready for you yet, {player}."
  npc-too-many: "You've got your hands full. Finish one of your side quests first."
  npc-daily-cooldown: "Come back in <time> and I'll have another job for you."
  npc-chapter-gate: "{npc:<gate>} still needs your help. Do <left> more jobs for them first."
  shield: "<aqua>✦ This villager's area is protected."
  journey-finished: "<gold>★ <white><player></white> finished the journey and freed the Hollow King!"
