    name: "<aqua><bold>Queen Brinewyn"
    health: 350
    weapon: TRIDENT
    minions: DROWNED
    minion-count: 4
    events: [slowness, lightning]
  story_enforcer_hunter:
    giver: enforcer_hunter
    entity: PIGLIN_BRUTE
    name: "<gold>Goldtooth's Enforcer"
    health: 220
    weapon: GOLDEN_AXE
    minions: NONE
    minion-count: 0
    events: [roar, lightning]
  story_emberly:
    giver: emberly
