    name: "<white><bold>The Echo Wind"
    health: 200
    minions: NONE
    minion-count: 0
    events: [levitate, lightning]
  story_aldis_elder:
    giver: aldis_elder
    entity: WARDEN
    name: "<dark_aqua><bold>The Listener Below"
    health: 0
    minions: NONE
    minion-count: 0
    events: [darkness, lightning, roar]
